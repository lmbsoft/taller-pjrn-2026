// DETECTOR DE DATOS SENSIBLES (ejercitación)
// ═══════════════════════════════════════════════════════════════

const MANUAL_CLS = 'bg-indigo-200 text-indigo-900';

function detectPII(text, manual = []) {
  const hits = [];

  // Lo etiquetado a mano tiene prioridad y se aplica a todas sus apariciones.
  manual.forEach(m => {
    if (!m.text) return;
    const re = new RegExp(esc(m.text), 'g');
    let x;
    while ((x = re.exec(text)) !== null) {
      if (x.index === re.lastIndex) re.lastIndex++;
      hits.push({ start: x.index, end: x.index + x[0].length, text: x[0], prio: 2, tag: m.tag, manual: true, det: { id: 'manual', label: 'Etiquetado a mano', cls: MANUAL_CLS } });
    }
  });

  anonDetectors.forEach(d => {
    const base = d.build ? d.build() : d.re;
    const re = new RegExp(base.source, base.flags.includes('g') ? base.flags : base.flags + 'g');
    let m;
    while ((m = re.exec(text)) !== null) {
      const t = m[0];
      if (m.index === re.lastIndex) re.lastIndex++;
      if (t.trim().length < 3) continue;

      if (d.id === 'persona') {
        const limpio = t.trim();
        if (anonStopwords.has(limpio)) continue;
        if (anonPrefijosProcesales.includes(limpio.split(/\s+/)[0])) continue;
        // Un renglón entero en mayúsculas y corto suele ser un título.
        const ini = text.lastIndexOf('\n', m.index) + 1;
        let fin = text.indexOf('\n', m.index);
        if (fin === -1) fin = text.length;
        if (text.slice(ini, fin).trim() === limpio && limpio.split(/\s+/).length <= 4) continue;
      }

      if (d.id === 'iniciales' && anonNoIniciales.has(t.trim().replace(/\.$/, ''))) continue;

      if (d.id === 'dni' || d.id === 'tel' || d.id === 'domsin') {
        // Un monto en pesos tiene la misma forma que un documento o un teléfono.
        const antes = text.slice(Math.max(0, m.index - 14), m.index);
        if (/[$]\s*$/.test(antes) || /PESOS\s*\(?\s*$/i.test(antes)) continue;
      }

      // La puntuación final no forma parte del dato.
      const recorte = t.replace(/[.,;:)\s]+$/, '');
      if (recorte.length < 3) continue;
      hits.push({ start: m.index, end: m.index + recorte.length, text: recorte, prio: 1, tag: d.tag, det: d });
    }
  });

  hits.sort((a, b) => (a.start - b.start) || (b.prio - a.prio) || ((b.end - b.start) - (a.end - a.start)));
  const clean = [];
  let last = -1;
  hits.forEach(h => { if (h.start >= last) { clean.push(h); last = h.end; } });
  return clean;
}

function assignTags(hits) {
  const people = new Map();
  let i = 0;
  hits.forEach(h => {
    if (h.manual) return;
    if (h.det.id === 'persona' || h.det.id === 'pila' || h.det.id === 'trato' || h.det.id === 'iniciales') {
      const key = h.text.trim().toUpperCase().replace(/^(DR|DRA|SR|SRA|SRTA|LIC|ING|CDOR|CRA)\.?\s+/, '');
      if (!people.has(key)) people.set(key, '[PERSONA_' + String.fromCharCode(65 + (i++ % 26)) + ']');
      h.tag = people.get(key);
    }
  });
  return people;
}

// Etiquetas de uso frecuente, para que marcar sea un clic y no una decisión.
const anonEtiquetasComunes = [
  '[DOMICILIO]', '[DNI]', '[EXPEDIENTE]', '[CARÁTULA]', '[TELÉFONO]', '[CORREO]',
  '[LOCALIDAD]', '[FECHA]', '[EDAD]', '[NNA]', '[DATO_SALUD]', '[LEGAJO]',
  '[ORGANISMO]', '[ESCUELA]', '[DOMINIO]', '[MATRÍCULA]', '[VÍNCULO]', '[MONTO]'
];

const AnonDetector = () => {
  const [text, setText] = useState('');
  const [ran, setRan] = useState(false);
  const [manual, setManual] = useState([]);
  const [sel, setSel] = useState('');
  const [nuevo, setNuevo] = useState('');
  const [ultima, setUltima] = useState(null);
  const areaRef = React.useRef(null);

  // En un celular la selección no dispara mouseup: la marca el gesto táctil y el
  // navegador avisa por selectionchange. Sin esto, etiquetar a mano no funciona.
  useEffect(() => {
    let t = null;
    const onSel = () => { clearTimeout(t); t = setTimeout(() => leerSeleccion(), 180); };
    document.addEventListener('selectionchange', onSel);
    return () => { clearTimeout(t); document.removeEventListener('selectionchange', onSel); };
  }, []);

  const analysis = useMemo(() => {
    if (!ran || !text.trim()) return null;
    const hits = detectPII(text, manual);
    assignTags(hits);
    let anon = text;
    [...hits].reverse().forEach(h => { anon = anon.slice(0, h.start) + h.tag + anon.slice(h.end); });
    const counts = {};
    hits.forEach(h => { counts[h.det.label] = (counts[h.det.label] || 0) + 1; });
    const glosario = [];
    const vistos = new Set();
    hits.forEach(h => {
      const k = h.tag + '||' + h.text.trim();
      if (!vistos.has(k)) { vistos.add(k); glosario.push({ tag: h.tag, orig: h.text.trim(), cat: h.det.label, manual: !!h.manual }); }
    });
    const etiquetas = Array.from(new Set(hits.map(h => h.tag))).sort();
    return { hits, anon, counts, glosario, etiquetas };
  }, [text, ran, manual]);

  const segments = useMemo(() => {
    if (!analysis) return null;
    const out = [];
    let pos = 0;
    analysis.hits.forEach((h, i) => {
      if (h.start > pos) out.push({ plain: text.slice(pos, h.start), key: 'p' + i });
      out.push({ hit: h, key: 'h' + i });
      pos = h.end;
    });
    if (pos < text.length) out.push({ plain: text.slice(pos), key: 'pz' });
    return out;
  }, [analysis, text]);

  // Etiquetas ya presentes, para reutilizar la misma entidad.
  const enUso = useMemo(() => {
    const s = new Set(manual.map(m => m.tag));
    if (analysis) analysis.etiquetas.forEach(t => s.add(t));
    return Array.from(s).sort();
  }, [analysis, manual]);

  // Próxima letra libre de persona.
  const proximaPersona = useMemo(() => {
    const usadas = new Set(enUso.filter(t => /^\[PERSONA_[A-Z]\]$/.test(t)).map(t => t.charAt(9)));
    for (let i = 0; i < 26; i++) {
      const l = String.fromCharCode(65 + i);
      if (!usadas.has(l)) return '[PERSONA_' + l + ']';
    }
    return '[PERSONA_Z]';
  }, [enUso]);

  // Cualquier selección sirve: en el recuadro de edición o en el texto marcado.
  const leerSeleccion = () => {
    const a = areaRef.current;
    let s = '';
    if (a && a.selectionStart !== a.selectionEnd) s = a.value.slice(a.selectionStart, a.selectionEnd);
    if (!s) { const w = window.getSelection(); s = w ? w.toString() : ''; }
    // En táctil las manijas de selección suelen llevarse la puntuación de al lado.
    s = s.replace(/\s+/g, ' ').replace(/^[\s.,;:()«»"'¿?¡!-]+|[\s.,;:()«»"'¿?¡!-]+$/g, '');
    setSel(s.length >= 2 && s.length <= 120 ? s : '');
  };

  const etiquetar = (tag) => {
    const t = (tag || '').trim();
    if (!sel || !t) return;
    const etiqueta = t.startsWith('[') ? t : '[' + t.toUpperCase().replace(/\s+/g, '_') + ']';
    setManual(m => [...m.filter(x => x.text !== sel), { text: sel, tag: etiqueta }]);
    setUltima({ text: sel, tag: etiqueta });
    setSel('');
    setNuevo('');
    setRan(true);
    if (window.getSelection) window.getSelection().removeAllRanges();
  };

  const cargar = (s) => { setText(s.text); setRan(false); setManual([]); setSel(''); setUltima(null); };

  const chip = (t, extra = '') => (
    <button key={t} onClick={() => etiquetar(t)}
      className={`px-3 py-2 min-h-[2.5rem] rounded-lg text-xs font-mono font-bold border transition-all ${extra || 'bg-white border-indigo-300 text-indigo-800 hover:bg-indigo-600 hover:text-white hover:border-indigo-600'}`}>
      {t}
    </button>
  );

  return (
    <div className="space-y-6" onMouseUp={leerSeleccion} onKeyUp={leerSeleccion} onTouchEnd={() => setTimeout(leerSeleccion, 120)}>
      <Callout tone="amber" icon={AlertTriangle} title="Esto es una herramienta de ejercitación">
        Sirve para entrenar el ojo y practicar el criterio, no para dejar un documento listo para usar. Para trabajar con
        documentación propia está el entorno de cuadernos sobre fuentes, que sí admite cargar los archivos directamente.
        Acá se practica: mirás qué detecta un patrón automático, qué se le escapa y qué marca de más.
      </Callout>

      <Callout tone="emerald" icon={Lock} title="Nada sale de tu equipo">
        Todo corre en tu navegador. El texto no se envía a ningún servidor, no se guarda y desaparece al recargar.
      </Callout>

      <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
        <h4 className="font-bold text-slate-800 mb-3 flex items-center gap-2"><FileText className="w-4 h-4 text-rose-500" /> Textos de ejemplo</h4>
        <div className="grid sm:grid-cols-2 gap-2">
          {anonSamples.map(s => (
            <button key={s.id} onClick={() => cargar(s)}
              className="text-left p-3 rounded-xl border-2 border-slate-200 hover:border-rose-400 transition-all">
              <span className={`text-[0.65rem] font-black uppercase tracking-widest ${s.id === 'dificil' ? 'text-amber-600' : 'text-emerald-600'}`}>{s.nivel}</span>
              <p className="font-bold text-slate-800 text-sm">{s.label}</p>
              <p className="text-xs text-slate-500">{s.hint}</p>
            </button>
          ))}
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
        <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
          <h4 className="font-bold text-slate-800 flex items-center gap-2"><Eraser className="w-4 h-4 text-rose-500" /> Texto a revisar</h4>
          <div className="flex flex-wrap gap-2">
            <button onClick={() => setRan(true)} disabled={!text.trim()}
              className="px-4 py-2 rounded-lg font-bold text-sm bg-rose-600 text-white hover:bg-rose-700 disabled:opacity-40 inline-flex items-center gap-2">
              <ShieldAlert className="w-4 h-4" /> Detectar
            </button>
            <button onClick={() => { setText(''); setRan(false); setManual([]); setSel(''); setUltima(null); }}
              className="px-3 py-2 rounded-lg text-xs font-medium bg-slate-100 text-slate-700 hover:bg-slate-200">Limpiar</button>
          </div>
        </div>

        <textarea ref={areaRef} value={text} onChange={e => { setText(e.target.value); setRan(false); }}
          onSelect={leerSeleccion} rows={10}
          placeholder="Pegá acá un texto de práctica, o elegí uno de los ejemplos de arriba."
          className="w-full p-4 rounded-xl border-2 border-slate-300 font-mono text-[0.8em] leading-relaxed focus:border-sky-500 outline-none" />

        {/* Barra de etiquetado: aparece sola al seleccionar, arriba o abajo. */}
        {sel ? (
          <div className="mt-3 rounded-xl border-2 border-indigo-400 bg-indigo-50 p-4">
            <p className="text-sm text-indigo-900 mb-3">
              Etiquetar <strong className="bg-indigo-200 px-1.5 py-0.5 rounded">{sel}</strong> en todas sus apariciones:
            </p>
            <div className="flex flex-wrap gap-1.5 mb-3">
              {chip(proximaPersona, 'bg-fuchsia-600 border-fuchsia-600 text-white hover:bg-fuchsia-700')}
              {enUso.filter(t => t !== proximaPersona).map(t => chip(t, 'bg-indigo-600 border-indigo-600 text-white hover:bg-indigo-700'))}
            </div>
            <p className="text-[0.65rem] font-black uppercase tracking-widest text-indigo-700 mb-1.5">Etiquetas frecuentes</p>
            <div className="flex flex-wrap gap-1.5 mb-3">
              {anonEtiquetasComunes.filter(t => !enUso.includes(t)).map(t => chip(t))}
            </div>
            <div className="flex flex-wrap gap-2">
              <input value={nuevo} onChange={e => setNuevo(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter') etiquetar(nuevo); }}
                placeholder="Otra etiqueta…"
                className="flex-1 min-w-[10rem] p-2 rounded-lg border-2 border-indigo-300 text-sm focus:border-indigo-500 outline-none" />
              <button onClick={() => etiquetar(nuevo)} disabled={!nuevo.trim()}
                className="px-4 py-2 rounded-lg text-sm font-bold bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-40">Usar</button>
              <button onClick={() => setSel('')}
                className="px-3 py-2 rounded-lg text-sm font-medium bg-white border border-indigo-300 text-indigo-700 hover:bg-indigo-100">Cancelar</button>
            </div>
          </div>
        ) : (
          <p className="mt-3 text-sm text-slate-500 flex items-start gap-2">
            <Layers className="w-4 h-4 mt-0.5 flex-shrink-0 text-indigo-500" />
            <span><strong>Seleccioná con el mouse</strong> cualquier fragmento —acá arriba o en el texto marcado de abajo— y
              aparecen las etiquetas para asignarlo de un clic. Es la forma de marcar lo que el detector no vio.
              {ultima && <span className="text-emerald-700 font-semibold"> Última: «{ultima.text}» → {ultima.tag}.</span>}</span>
          </p>
        )}

        {manual.length > 0 && (
          <div className="mt-3">
            <p className="text-xs font-bold text-slate-500 uppercase mb-2">Etiquetado a mano ({manual.length})</p>
            <div className="flex flex-wrap gap-2">
              {manual.map((m, i) => (
                <span key={i} className="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs bg-indigo-100 border border-indigo-300 text-indigo-900">
                  <span className="font-mono font-bold">{m.tag}</span>
                  <span className="opacity-70">← {m.text}</span>
                  <button onClick={() => setManual(x => x.filter((_, j) => j !== i))} className="font-bold hover:text-rose-700" title="Quitar">×</button>
                </span>
              ))}
            </div>
          </div>
        )}
      </div>

      {analysis && (
        <>
          <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
            <h4 className="font-bold text-slate-800 mb-3 flex items-center gap-2"><ListChecks className="w-4 h-4 text-rose-500" /> Qué encontró</h4>
            {analysis.hits.length === 0 ? (
              <p className="text-slate-600">No se detectaron patrones conocidos. Eso <strong>no</strong> significa que el texto esté limpio:
                seleccioná con el mouse lo que veas y etiquetalo a mano.</p>
            ) : (
              <>
                <div className="flex flex-wrap gap-2 mb-4">
                  {Object.entries(analysis.counts).map(([k, v]) => (
                    <span key={k} className="px-3 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-700 border border-slate-200">{k}: {v}</span>
                  ))}
                </div>
                <p className="text-xs text-slate-500 mb-2">Podés seleccionar texto acá abajo para etiquetarlo.</p>
                <div className="rounded-xl border border-slate-200 bg-slate-50 p-4 max-h-80 overflow-y-auto whitespace-pre-wrap text-[0.85em] leading-relaxed select-text">
                  {segments.map(s => s.plain !== undefined
                    ? <span key={s.key}>{s.plain}</span>
                    : <mark key={s.key} className={`pii ${s.hit.det.cls}`} title={s.hit.det.label + ' → ' + s.hit.tag}>{s.hit.text}</mark>)}
                </div>
              </>
            )}
          </div>

          <Callout tone="amber" icon={AlertTriangle} title="Leé los resultados con criterio">
            <p className="mb-2">Marca de más y marca de menos, y las dos cosas son esperables:</p>
            <ul className="list-disc pl-5 space-y-1">
              <li>Los nombres de organismos en mayúsculas aparecen como personas. No lo son.</li>
              <li>No todo lo que detecta hay que anonimizarlo: una fecha procesal o una localidad grande pueden quedarse.</li>
              <li>Un apodo, un nombre poco frecuente o una referencia indirecta no los ve ningún patrón.</li>
              <li>La reidentificación por combinación de datos no la detecta ninguna herramienta: eso lo ves vos.</li>
            </ul>
            <p className="mt-2 font-semibold">Para todo lo que se le escapa está la selección con el mouse. Esa es la parte que entrena.</p>
          </Callout>

          {analysis.hits.length > 0 && (
            <>
              <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
                  <h4 className="font-bold text-slate-800 flex items-center gap-2"><ShieldCheck className="w-4 h-4 text-emerald-600" /> Versión con etiquetas</h4>
                  <CopyBtn text={analysis.anon} label="Copiar versión etiquetada" small />
                </div>
                <div className="rounded-xl border border-emerald-200 bg-emerald-50 p-4 max-h-80 overflow-y-auto whitespace-pre-wrap text-[0.85em] leading-relaxed text-emerald-950">
                  {analysis.anon}
                </div>

const MemoryPairs = ({ data }) => {
  const cards = useMemo(() => shuffle(data.pairs.flatMap(p => [
    { id: p.id, side: 'a', text: p.a }, { id: p.id, side: 'b', text: p.b }
  ]), 13), [data]);
  const [sel, setSel] = useState([]);
  const [done, setDone] = useState([]);
  const [tries, setTries] = useState(0);

  const click = (i) => {
    if (sel.includes(i) || done.includes(cards[i].id) || sel.length === 2) return;
    const next = [...sel, i];
    setSel(next);
    if (next.length === 2) {
      setTries(t => t + 1);
      const [x, y] = next;
      if (cards[x].id === cards[y].id && cards[x].side !== cards[y].side) {
        setTimeout(() => { setDone(d => [...d, cards[x].id]); setSel([]); }, 500);
      } else {
        setTimeout(() => setSel([]), 900);
      }
    }
  };
  const complete = done.length === data.pairs.length;

  return (
    <div>
      <div className="grid grid-cols-2 md:grid-cols-3 gap-2 mb-4">
        {cards.map((c, i) => {
          const matched = done.includes(c.id);
          const active = sel.includes(i);
          return (
            <button key={i} onClick={() => click(i)} disabled={matched}
              className={`p-3 rounded-xl text-sm text-left min-h-[5rem] transition-all border-2 ${matched ? 'bg-emerald-50 border-emerald-300 text-emerald-900' :
                active ? 'bg-indigo-100 border-indigo-400 text-indigo-900' : 'bg-white border-slate-200 text-slate-700 hover:border-slate-400'}`}>
              {c.text}
            </button>
          );
        })}
      </div>
      <div className="flex items-center justify-between text-sm">
        <span className="text-slate-500">{done.length} de {data.pairs.length} · {tries} intentos</span>
        {complete && <span className="font-bold text-emerald-700 flex items-center gap-2"><CheckCircle2 className="w-4 h-4" /> Completo</span>}
      </div>
    </div>
  );
};

const OrderSteps = ({ data }) => {
  const pool = useMemo(() => shuffle(data.steps, 29), [data]);
  const [picked, setPicked] = useState([]);
  const [error, setError] = useState(null);
  const next = data.steps[picked.length];

  const click = (s) => {
    if (picked.includes(s)) return;
    if (s === next) { setPicked(p => [...p, s]); setError(null); }
    else { setError(s); setTimeout(() => setError(null), 1200); }
  };

  return (
    <div>
      <div className="space-y-2 mb-4">
        {pool.map((s, i) => {
          const idx = picked.indexOf(s);
          const ok = idx >= 0;
          return (
            <button key={i} onClick={() => click(s)} disabled={ok}
              className={`w-full text-left p-3 rounded-xl text-sm border-2 transition-all flex items-start gap-3 ${ok ? 'bg-emerald-50 border-emerald-300 text-emerald-900' :
                error === s ? 'bg-rose-100 border-rose-400 text-rose-900' : 'bg-white border-slate-200 text-slate-700 hover:border-slate-400'}`}>
              <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 ${ok ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-500'}`}>{ok ? idx + 1 : '·'}</span>
              <span>{s}</span>
            </button>
          );
        })}
      </div>
      {picked.length === data.steps.length && (
        <p className="font-bold text-emerald-700 flex items-center gap-2 text-sm"><CheckCircle2 className="w-4 h-4" /> Circuito completo y en orden.</p>
      )}
    </div>
  );
};

const BiasDetector = () => {
  const [t, setT] = useState('');
  const hits = useMemo(() => {
    if (!t.trim()) return [];
    const out = [];
    biasPatterns.forEach(p => {
      const re = new RegExp(p.re.source, p.re.flags);
      let m;
      while ((m = re.exec(t)) !== null) {
        if (m.index === re.lastIndex) re.lastIndex++;
        out.push({ start: m.index, end: m.index + m[0].length, text: m[0], why: p.why });
      }
    });
    out.sort((a, b) => a.start - b.start);
    const clean = []; let last = -1;
    out.forEach(h => { if (h.start >= last) { clean.push(h); last = h.end; } });
    return clean;
  }, [t]);

  const segs = useMemo(() => {
    const o = []; let pos = 0;
    hits.forEach((h, i) => {
      if (h.start > pos) o.push({ p: t.slice(pos, h.start), k: 'p' + i });
      o.push({ h, k: 'h' + i }); pos = h.end;
    });
    if (pos < t.length) o.push({ p: t.slice(pos), k: 'pz' });
    return o;
  }, [hits, t]);

  return (
    <div className="space-y-3">
      <textarea value={t} onChange={e => setT(e.target.value)} rows={4}
        placeholder="Escribí un pedido como se lo harías a un asistente. Por ejemplo: ¿No te parece que corresponde rechazar este planteo?"
        className="w-full p-3 rounded-xl border-2 border-slate-300 text-sm focus:border-amber-500 outline-none" />
      {t.trim() && (
        hits.length === 0 ? (
          <p className="text-sm text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-xl p-3 flex items-start gap-2">
            <CheckCircle2 className="w-4 h-4 mt-0.5 flex-shrink-0" />
            <span>No aparecen expresiones que adelanten la respuesta. Igual revisá vos: el sesgo también entra por qué información elegiste dar y cuál omitiste.</span>
          </p>
        ) : (
          <>
            <div className="rounded-xl border border-slate-200 bg-slate-50 p-3 text-sm leading-relaxed whitespace-pre-wrap">
              {segs.map(s => s.p !== undefined ? <span key={s.k}>{s.p}</span>
                : <mark key={s.k} className="pii bg-amber-200 text-amber-900">{s.h.text}</mark>)}
            </div>
            <ul className="space-y-1">
              {hits.map((h, i) => (
                <li key={i} className="text-sm text-amber-900 flex items-start gap-2">
                  <AlertTriangle className="w-4 h-4 mt-0.5 flex-shrink-0 text-amber-500" />
                  <span><strong>«{h.text}»</strong> — {h.why}</span>
                </li>
              ))}
            </ul>
          </>
        )
      )}
    </div>
  );
};

// Marcas que el modelo debe producir en su respuesta: no son huecos a completar.
const NO_ES_HUECO = new Set([
  'verificar', 'ilegible', 'aprox', 'falta desarrollo', 'corchetes', 'dobles corchetes',
  'recortado: qué', 'no consta', 'sin información', 'Falta información'
]);

const esHueco = (t) => {
  const s = t.trim();
  if (!s || s.length > 60) return false;
  if (NO_ES_HUECO.has(s)) return false;
  if (/^[A-ZÁÉÍÓÚÑ_0-9\s]+$/.test(s)) return false; // etiquetas tipo [DNI]
  return true;
};

// Bloque de prompt con los huecos completables. Lo que se copia es el texto ya
// relleno con lo que hayas escrito; lo que quede vacío se copia como está.
const PromptBlock = ({ text, label }) => {
  const partes = useMemo(() => text.split(/(\[\[[^\]]*\]\]|\[[^\]]*\])/g), [text]);
  const huecos = useMemo(() => {
    const out = [];
    partes.forEach(p => {
      const m = /^\[([^[\]]*)\]$/.exec(p);
      if (m && esHueco(m[1]) && !out.includes(m[1].trim())) out.push(m[1].trim());
    });
    return out;
  }, [partes]);

  const [vals, setVals] = useState({});
  const set = (k, v) => setVals(o => ({ ...o, [k]: v }));

  const relleno = useMemo(() => partes.map(p => {
    const m = /^\[([^[\]]*)\]$/.exec(p);
    if (m && esHueco(m[1]) && (vals[m[1].trim()] || '').trim()) return vals[m[1].trim()].trim();
    return p;
  }).join(''), [partes, vals]);

  const completos = huecos.filter(h => (vals[h] || '').trim()).length;

  return (
    <div className="my-3">
      {huecos.length > 0 && (
        <div className="rounded-t-xl border border-b-0 border-amber-300 bg-amber-50 p-3">
          <p className="text-[0.65rem] font-black uppercase tracking-widest text-amber-700 mb-2">
            Completá antes de copiar · {completos} de {huecos.length}
          </p>
          <div className="grid sm:grid-cols-2 gap-2">
            {huecos.map(h => (
              <label key={h} className="block">
                <span className="text-xs font-medium text-amber-900">{h}</span>
                <input value={vals[h] || ''} onChange={e => set(h, e.target.value)}
                  placeholder={h}
                  className="w-full p-2 rounded-lg border-2 border-amber-300 text-sm bg-white focus:border-amber-500 outline-none" />
              </label>
            ))}
          </div>
        </div>
      )}
      <div className={`overflow-hidden border border-slate-700 ${huecos.length > 0 ? 'rounded-b-xl' : 'rounded-xl'}`}>
        <div className="bg-slate-800 px-4 py-2 flex items-center justify-between gap-3">
          <span className="text-[0.65rem] font-bold uppercase tracking-widest text-slate-400">{label || 'Tu mensaje al asistente'}</span>
          <CopyBtn text={relleno} small />
        </div>
        <div className="bg-slate-900 text-slate-100 p-4 text-[0.82em] leading-loose font-mono whitespace-pre-wrap">
          {partes.map((p, i) => {
            const m = /^\[([^[\]]*)\]$/.exec(p);
            if (m && esHueco(m[1])) {
              const n = m[1].trim();
              const v = (vals[n] || '').trim();
              return v
                ? <span key={i} className="bg-emerald-500/25 text-emerald-200 rounded px-1.5 py-0.5 mx-0.5">{v}</span>
                : <span key={i} className="bg-amber-400/25 text-amber-200 rounded px-1.5 py-0.5 mx-0.5 border border-amber-400/40">{n}</span>;
            }
            if (/^\[\[.*\]\]$/.test(p)) return <span key={i} className="text-sky-300">{p}</span>;
            return <span key={i}>{p}</span>;
          })}
        </div>
      </div>
    </div>
  );
};

const Turn = ({ c }) => {
  if (c.role === 'alerta') return (
    <div className="my-5 flex gap-3 border-l-4 border-rose-500 bg-rose-50/70 rounded-r-xl py-4 pl-4 pr-4">
      <AlertTriangle className="w-5 h-5 text-rose-600 flex-shrink-0 mt-0.5" />
      <div>
        <span className="block text-[0.7rem] font-black uppercase tracking-widest text-rose-700 mb-1">Pará un segundo</span>
        <p className="text-rose-900 font-medium">{c.text}</p>
      </div>
    </div>
  );

  if (c.role === 'resultado') return (
    <div className="mt-5 rounded-xl border-2 border-emerald-300 bg-emerald-50 p-4 flex gap-3">
      <CheckCircle2 className="w-5 h-5 text-emerald-600 flex-shrink-0 mt-0.5" />
      <div>
        <span className="block text-[0.7rem] font-black uppercase tracking-widest text-emerald-700 mb-1">Cómo terminó</span>
        <p className="text-emerald-900">{c.text}</p>
      </div>
    </div>
  );

  const mine = c.role === 'usuario' || c.role === 'ajuste';

  return (
    <div className={`flex gap-2.5 items-end ${mine ? 'flex-row-reverse' : ''}`}>
      <div className={`w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 text-white text-xs font-bold ${mine ? (fix ? 'bg-amber-500' : 'bg-slate-500') : 'bg-gradient-to-br from-indigo-500 to-violet-600'}`}>
        {mine ? (fix ? <RefreshCw className="w-4 h-4" /> : 'V') : <BrainCircuit className="w-4 h-4" />}
      </div>
      <div className={`max-w-[85%] rounded-2xl px-4 py-3 ${mine
        ? (fix ? 'bg-amber-100 border border-amber-300 text-amber-950 rounded-br-sm' : 'bg-slate-800 text-slate-50 rounded-br-sm')
        : 'bg-white border border-slate-200 text-slate-800 rounded-bl-sm shadow-sm'}`}>
        {fix && <span className="block text-[0.65rem] font-black uppercase tracking-widest text-amber-700 mb-1">Reformulado</span>}
        <p className="text-[0.95em] leading-relaxed">{c.text}</p>
      </div>
    </div>
  );
};

                <button onClick={() => setPaso(e.n + 1)}

              {e.n === libEvolucion.length && (
                <p className="mt-4 text-center font-bold text-slate-700 bg-slate-100 rounded-xl p-3 text-sm">
                  Rol + Contexto + Tarea clara + Formato + Restricciones

            </div>
          ))}
        </div>
      )}
    </div>
  );
};
