<body>
<div class="marco">
  <div class="eyebrow">Actividad 3 · Bloque 2 · Tokens</div>
  <h1>¿Qué ve realmente el modelo?</h1>
  <p class="instr">El modelo no lee palabras: las parte en <strong>tokens</strong>. Escribí lo que quieras —probá con tu apellido— y mirá cómo se fragmenta en vivo. (Aproximación didáctica del proceso real.)</p>

  <div class="presets" id="presets"></div>

  </div>

  <div class="tokens" id="tokens"></div>

  <div class="moraleja">
    <strong>Por qué importa:</strong> todo se mide (y se cobra) en tokens — el costo de cada consulta y el tamaño de la mesa de trabajo. Las palabras técnicas o infrecuentes se rompen en pedazos: "Constitución" suele ser <strong>Constitu + ción</strong>. En castellano, un token ronda los 3–4 caracteres, y una carilla A4 son unos <strong>600 tokens</strong>. Un expediente de 300 fojas… hacé la cuenta: por eso la mesa de trabajo se llena.
  </div>

  <footer>Taller IAGen · Poder Judicial de Río Negro · 2026</footer>
</div>

<script>
const PRESETS=[
 "Escribí acá tu apellido y mirá en cuántos pedazos se rompe",
 "La Constitución Nacional, en su artículo 14 bis, garantiza el trabajo.",
 "Expte. RO-12819-C-0000 · M.J.L. c/ Peugeot Citroen Argentina S.A.",
 "inconstitucionalidad sobreviniente",
 "Hola 👋 ¿cómo va? ⚖️🤖",
 "Acordada 22/25 — multa de 2 a 20 Jus (arts. 29 a 32, Ley 5731)"
];
const COL=["#8a6d2f","#5b6ba8","#2e6b4f","#9c2b2e","#b07a23","#6d5a8f","#3a7a8a"];
const COMUNES=new Set(["la","el","los","las","un","una","de","del","en","y","o","a","que","es","con","por","para","su","sus","al","se","no","lo","si","ya","ha","fue","ser","sin","sobre","más","como","este","esta","bis","c/","s/"]);

function tokenizar(t){
  const toks=[];const parts=t.split(/(\\s+)/);
  for(const p of parts){
    if(!p)continue;
    if(/^\\s+$/.test(p)){toks.push({t:p,ws:true});continue;}
    const m=p.match(/^([^.,;:()¿?¡!«»"']*)([.,;:()¿?¡!«»"']+)?$/u);
    let core=p,tail='';
    if(m&&m[2]!==undefined){core=m[1];tail=m[2];}
    if(!core){toks.push({t:tail});continue;}
    const low=core.toLowerCase();
    if(COMUNES.has(low)||core.length<=4){toks.push({t:core});}
    else if(/^[\\d./-]+$/.test(core)){
      for(let i=0;i<core.length;i+=3)toks.push({t:core.slice(i,i+3)});
    } else {
      const suf=["ación","ición","ución","alidad","amente","emente","iente","encia","ancia","mente","ando","iendo","ado","ido","ción","dad"];
      let pieces=null;
      for(const s of suf){
        if(core.length>s.length+3&&low.endsWith(s)){
          pieces=[core.slice(0,core.length-s.length),core.slice(core.length-s.length)];break;
        }
      }
      if(!pieces){
        if(core.length>9){
          const a=Math.ceil(core.length/3);
          pieces=[core.slice(0,a),core.slice(a,a*2),core.slice(a*2)].filter(Boolean);
        } else if(core.length>6){
          const h=Math.ceil(core.length/2);
          pieces=[core.slice(0,h),core.slice(h)];
        } else pieces=[core];
      }
      pieces.forEach(x=>toks.push({t:x}));
    }
    if(tail)toks.push({t:tail});
  }
  return toks;
}

const $=id=>document.getElementById(id);
const inp=$('input');

function render(){
  const t=inp.value;
  const toks=tokenizar(t);
  const cont=$('tokens');cont.innerHTML='';
  let ci=0;
  toks.forEach(tk=>{
    const s=document.createElement('span');
    if(tk.ws){
      s.className='tk ws';
      s.textContent=tk.t.replace(/ /g,'·').replace(/\\n/g,'↵');
    } else {
      s.className='tk';
      const c=COL[ci%COL.length];
      s.style.background=c+'1f';s.style.color=c;s.style.borderColor=c+'66';
      s.textContent=tk.t;ci++;
    }
    cont.appendChild(s);
  });
  const real=toks.filter(x=>!x.ws).length;
  $('sc').textContent=t.length;
  $('sw').textContent=t.trim()?t.trim().split(/\\s+/).length:0;
  $('st').textContent=real;
  $('sr').textContent=real?(t.length/real).toFixed(1):'0';
}
inp.addEventListener('input',render);

const pb=$('presets');
PRESETS.forEach(p=>{
  const b=document.createElement('button');
  b.textContent=p.length>42?p.slice(0,40)+'…':p;
  b.title=p;
  b.addEventListener('click',()=>{inp.value=p;render();inp.focus();});
  pb.appendChild(b);
});
render();
<\/script>
</body>

  <div class="controles">
    <button class="add" data-e="📜" data-t="norma">+ Normativa<small>Ley, acordada, decreto</small></button>

  </div>
  <div class="fila">
    <button class="vaciar" id="vaciar">🗑 Vaciar mesa</button>
    <div class="medidor" id="medidor">1 / 12</div>
  </div>

  <div class="mesa" id="mesa"></div>
  <div class="aviso" id="aviso">⚠️ <strong>La mesa se llenó.</strong> Cada ficha nueva tira la más antigua — incluida, quizás, la consigna que diste al principio del chat. El modelo no avisa: simplemente deja de verla.</div>

  <div class="moraleja">
    <strong>Lo que hay que llevarse:</strong> en un chat largo, lo que dijiste al principio puede haberse caído de la mesa — por eso el modelo "se olvida" de la consigna inicial. Si la instrucción importa, <strong>repetila o abrí un chat nuevo</strong> y volvé a fijar el contexto. Y recordá: lo que ponés acá no entrena al modelo; es información temporal de esta conversación.
  </div>

  <footer>Taller IAGen · Poder Judicial de Río Negro · 2026</footer>
</div>

<script>
const CAP=12;
const NOMBRES={
 norma:["Ley 24.240","Acordada 22/25 STJRN","CPCC Río Negro","Ley 27.551","Decreto reglamentario","CCyCN arts. 1090/91"],
 escrito:["Escrito de demanda","Contestación","Pericia mecánica","Cédula de notificación","Fallo de Cámara","Alegato"],
 pregunta:["¿Procede el daño punitivo?","¿Qué plazo corre?","¿Hay precedente local?","¿Cómo computar intereses?","¿Es competente el fuero?"],
 aclaracion:["Tono formal","Máx. 2 carillas","Citar solo fuentes verificadas","Sin latinismos","Formato de sumario"]
};
let fichas=[],contador=0;
const $=id=>document.getElementById(id);
const mesa=$('mesa');

function fijarSistema(){
  contador++;
  const d=document.createElement('div');
  d.className='ficha sistema';
  d.innerHTML='<span class="emoji">⚙️</span><span class="nom">Instrucciones del sistema</span><span class="edad">fija · no se cae</span>';
  mesa.appendChild(d);
}

function actualizar(){
  $('medidor').textContent=(fichas.length+1)+' / '+CAP;
  $('medidor').classList.toggle('lleno',fichas.length+1>=CAP);
  fichas.forEach((f,i)=>{
    const e=f.el.querySelector('.edad');
    if(i===fichas.length-1){e.textContent='↑ más reciente';e.className='edad';}
    else if(i===0){e.textContent='↓ a punto de caer';e.className='edad alerta';}
    else{e.textContent='ficha #'+f.id;e.className='edad';}
  });
}

document.querySelectorAll('.add').forEach(b=>{
  b.addEventListener('click',()=>{
    const t=b.dataset.t,e=b.dataset.e;
    const pool=NOMBRES[t];
    const nom=pool[Math.floor(Math.random()*pool.length)];
    contador++;
    if(fichas.length+1>=CAP){
      const vieja=fichas.shift();
      vieja.el.classList.add('cae');
      setTimeout(()=>vieja.el.remove(),480);
      $('aviso').style.display='block';
    }
    const d=document.createElement('div');
    d.className='ficha';
    d.innerHTML='<span class="emoji">'+e+'</span><span class="nom">'+nom+'</span><span class="edad"></span>';
    mesa.appendChild(d);
    fichas.push({el:d,id:contador});
    actualizar();
  });
});

$('vaciar').addEventListener('click',()=>{
  mesa.innerHTML='';fichas=[];contador=0;
  $('aviso').style.display='none';
  fijarSistema();actualizar();
});

fijarSistema();actualizar();
<\/script>
</body>
</html>

<div class="marco">
  <div class="eyebrow">Actividad 5 · Bloque 2 · Alucinaciones</div>
  <h1>Caza de alucinaciones</h1>
  <p class="instr">Un asistente de IA produjo estas cinco afirmaciones jurídicas, todas con el mismo tono profesional. <strong>¿Confiarías en cada una sin verificarla?</strong></p>

  <div id="zona"></div>

</div>

<script>
const items = [
  {
    cita:"«El art. 17 de la Ley 24.240 de Defensa del Consumidor habilita al consumidor, ante reparación no satisfactoria, a pedir la sustitución de la cosa, devolver la cosa con restitución del precio, o una quita proporcional.»",

  },
  {
    cita:"«La CSJN, en \\"Domínguez c/ Aseguradora Federal S.A.\\", Fallos 342:1881 (2019), estableció que la mora del asegurador se computa desde la denuncia del siniestro.»",
    veredicto:"rojo", selloTxt:"Inventada",
    exp:"Caso inexistente. El formato es impecable —carátula, tomo, año— y eso es exactamente lo peligroso: el modelo aprendió cómo LUCE una cita de Fallos, no qué fallos existen. El formato perfecto no prueba existencia."
  },
  {
    cita:"«La Cámara Nacional en lo Comercial, en \\"Rages c/ FCA Automobiles\\", sostuvo que cuando se ordena el reintegro del precio por el art. 17 LDC, los intereses se computan desde la fecha de adquisición del bien.»",
    veredicto:"rojo", selloTxt:"Alterada",
    exp:"El fallo existe… pero dice lo CONTRARIO. Esta es la cita alterada del caso real \\"M.J.L. c/ Peugeot Citroen\\" resuelto por la Cámara de Apelaciones de General Roca en 2025: ambas partes citaron el mismo precedente con conclusiones opuestas, y el tribunal lo detectó. Pasó acá, en Río Negro."
  },
  {
    cita:"«El art. 1198 del Código Civil consagra la teoría de la imprevisión, que permite la revisión del contrato ante una excesiva onerosidad sobreviniente.»",
    veredicto:"ambar", selloTxt:"Desactualizada",
    exp:"Era cierto… hasta 2015. El Código Civil de Vélez fue derogado; hoy la imprevisión está en los arts. 1090/1091 del CCyCN. Alucinación de actualidad: el modelo mezcla épocas porque su conocimiento tiene fecha de corte y no distingue vigencia por sí solo."
  },
  {
    cita:"«La Acordada 22/25 del STJ de Río Negro extiende el Protocolo de Buenas Prácticas sobre IAGen a los auxiliares externos del Poder Judicial, incluyendo abogados/as y peritos.»",

  const p = $('progreso'); p.innerHTML = '';
  items.forEach((_,i)=>{
    const d = document.createElement('div');
    d.className = 'punto' + (i < idx ? ' hecho' : i === idx ? ' actual' : '');
    p.appendChild(d);
  });
}

function mostrar(){
  pintarProgreso();
  const z = $('zona');
  if (idx >= items.length){ return mostrarFinal(); }
  const it = items[idx];
  z.innerHTML =
    '<div class="tarjeta">' +
      '<div class="cita">'+it.cita+'</div>' +
      '<div class="botones">' +
        '<button class="btn btn-ok" id="bOk">Parece confiable</button>' +
        '<button class="btn btn-no" id="bNo">Sospechosa</button>' +
      '</div>' +
      '<div id="rev" class="oculto" style="margin-top:14px"></div>' +
    '</div>';
  const responder = (eligioConfiable)=>{
    $('bOk').disabled = true; $('bNo').disabled = true;
    const esConfiable = it.veredicto === 'verde';
    const acerto = eligioConfiable === esConfiable;
    if (acerto) aciertos++;
    const claseSello = it.veredicto === 'verde' ? 's-verde' : it.veredicto === 'rojo' ? 's-rojo' : 's-ambar';
    $('rev').classList.remove('oculto');

      '<button class="btn-sig" id="bSig">'+(idx === items.length-1 ? 'Ver resultado' : 'Siguiente cita')+'</button>';
    $('bSig').addEventListener('click', ()=>{ idx++; mostrar(); });
  };
  $('bOk').addEventListener('click', ()=>responder(true));
  $('bNo').addEventListener('click', ()=>responder(false));
}

function mostrarFinal(){
  $('zona').innerHTML =
    '<div class="tarjeta final">' +
      '<div style="font-size:13px;color:#6b7280">Tu puntaje detectando alucinaciones</div>' +
      '<div class="nota">'+aciertos+' / '+items.length+'</div>' +
      '<div class="moraleja"><strong>Lo que hay que llevarse:</strong> aunque hayas acertado todas, lo hiciste <strong>adivinando</strong>: nada en el texto distinguía lo verdadero de lo inventado. El tono seguro, el formato impecable y la fluidez no son señales de verdad. Por eso la verificación manual contra fuentes oficiales no es opcional: tu firma = tu validación = tu responsabilidad.</div>' +
      '<button class="btn-sig" style="margin-top:12px" onclick="idx=0;aciertos=0;mostrar()">Jugar de nuevo</button>' +
    '</div>';
  pintarProgreso();
}

mostrar();
<\/script>
</body>
</html>

    <strong>Lo que hay que llevarse:</strong> el modelo sin verificación respondió <strong>todo</strong>, con el mismo tono profesional cuando acertaba y cuando inventaba. El modelo con RAG respondió solo desde el corpus, citó qué documento usó, y cuando no tenía nada, <strong>lo dijo</strong>. Esa es la lógica de herramientas como NotebookLM: subís tus documentos y el modelo responde únicamente desde ahí, citando la fuente. Para trabajo jurídico serio, esta arquitectura no es un lujo.
  </div>

  <footer>Taller IAGen · Poder Judicial de Río Negro · 2026</footer>
</div>

<script>
const CASOS=[
 {q:"¿Qué plazo fija la Acordada 31/23 del STJRN para contestar vistas digitales?",
  aluc:{txt:'La <strong>Acordada 31/23 del Superior Tribunal de Justicia de Río Negro</strong> establece un plazo de <span class="cita-dudosa">tres días hábiles</span> para contestar vistas digitales en el sistema de gestión, prorrogable por igual término mediante solicitud fundada presentada antes de su vencimiento (<span class="cita-dudosa">art. 4°</span>).',
   prob:"Esa acordada, con ese contenido, <strong>no existe</strong>. Número, materia y articulado fueron fabricados con un formato impecable. Si fundás un escrito en esto, el error es tuyo y de nadie más.",
   imp:"Fundar una presentación en normativa inexistente: pérdida de credibilidad, posible sanción correctiva (Acordada 22/25) y remisión al Colegio Profesional."},
  rag:{txt:'<strong>No encuentro la Acordada 31/23 en el corpus cargado</strong> (normativa STJRN 2023–2025). Para responder con precisión necesito que verifiques el número en la fuente oficial del STJ o cargues el texto de la acordada.',docs:[]}},
 {q:"¿Desde cuándo corren los intereses si se ordena reintegrar el precio por el art. 17 LDC?",
  aluc:{txt:'Conforme jurisprudencia consolidada, en particular <span class="cita-dudosa">"Rages c/ FCA Automobiles"</span> de la Cámara Nacional en lo Comercial, los intereses se computan <span class="cita-dudosa">desde la fecha de adquisición del bien</span>, pues desde ese momento el consumidor se ve privado del uso pleno del producto.',
   prob:"El fallo existe, pero sostiene <strong>lo contrario</strong>. Es exactamente la cita alterada que detectó la Cámara de Apelaciones de General Roca en \\"M.J.L. c/ Peugeot Citroen\\" (2025): ambas partes citaron el mismo precedente con conclusiones opuestas.",
   imp:"Citar un fallo real con contenido invertido es aún peor que inventarlo: el tribunal lo verifica en minutos. Pasó acá, en Río Negro, y la sentencia lo destaca 'por la gravedad que implica'."},
  rag:{txt:'Encontré el fallo en el corpus. Según el texto verificado de <strong>"Rages c/ FCA Automobiles"</strong> (Cám. Nac. Com.), el criterio sobre el cómputo de intereses es el que cita la parte demandada en el precedente local "M.J.L. c/ Peugeot Citroen". Te muestro el párrafo exacto del fallo para que lo verifiques antes de citarlo.',docs:["Rages c/ FCA Automobiles (texto completo)","M.J.L. c/ Peugeot Citroen — Cám. Apel. Gral. Roca 2025"]}},
 {q:"¿Cuál es el monto actual del Jus en Río Negro para calcular una multa procesal?",
  aluc:{txt:'El valor del Jus en la provincia de Río Negro asciende actualmente a <span class="cita-dudosa">$ 48.350</span>, conforme la última actualización dispuesta por el STJ. Una multa de 2 a 20 Jus (art. 30, Ley 5731) equivale entonces a entre $ 96.700 y $ 967.000.',
   prob:"El número es <strong>plausible pero inventado o desactualizado</strong>: el valor del Jus se actualiza periódicamente y el modelo no tiene forma de conocer la cifra vigente. Es una alucinación de actualidad: el conocimiento del modelo tiene fecha de corte.",
   imp:"Usar un valor desactualizado en una liquidación o un cálculo de sanción produce montos erróneos que cualquier contraparte detecta."},
  rag:{txt:'El corpus no incluye la resolución de actualización del Jus vigente a hoy. <strong>Este dato cambia con frecuencia</strong>: consultalo en la fuente oficial del STJRN y, si querés, cargá la resolución para que pueda usarla en cálculos verificables.',docs:[]}},
 {q:"Redactame un borrador de cédula de notificación de una audiencia.",
  aluc:{txt:'<strong>CÉDULA DE NOTIFICACIÓN</strong><br><br>Sr./Sra.: [nombre] — Domicilio: [constituido]<br>Carátula: [autos] — Expte.: [número]<br><br>Se le hace saber que se ha fijado audiencia para el día [fecha] a las [hora], a la que deberá comparecer en los términos del CPCC. Queda Ud. debidamente notificado/a.',
   prob:"Esta tarea <strong>sí es apropiada</strong> para el modelo: un borrador estándar con campos para completar, sin datos inventados. Igual corresponde verificar el formato exigido por el juzgado y la normativa local antes de usarlo.",
   imp:"Riesgo bajo. La regla no cambia: revisión humana antes de que cualquier pieza salga con tu firma."},
  rag:{txt:'Encontré en el corpus el modelo de cédula del fuero y los requisitos del CPCC local. Genero el borrador siguiendo ese formato, con los campos [a completar] marcados y la referencia normativa verificada del corpus.',docs:["Modelo de cédula — fuero civil","CPCC Río Negro — notificaciones"]}}
];

let modo='aluc',sel=null;
const $=id=>document.getElementById(id);

const pb=$('pregs');
CASOS.forEach((c,i)=>{
  const b=document.createElement('button');
  b.textContent=c.q;
  b.addEventListener('click',()=>{
    sel=i;
    document.querySelectorAll('.pregs button').forEach((x,j)=>x.classList.toggle('activa',j===i));
    render();
  });
  pb.appendChild(b);
});

$('mAluc').addEventListener('click',()=>{modo='aluc';$('mAluc').classList.add('activo');$('mRag').classList.remove('activo');render();});
$('mRag').addEventListener('click',()=>{modo='rag';$('mRag').classList.add('activo');$('mAluc').classList.remove('activo');render();});

function render(){
  const out=$('salida');
  if(sel===null){out.innerHTML='';return;}
  const c=CASOS[sel];
  if(modo==='aluc'){
    out.innerHTML='<div class="resp aluc"><div class="head">🤖 Respuesta del modelo · sin verificación</div>'+
      '<div>'+c.aluc.txt+'</div>'+
      '<button class="btn-ver" id="btnVer">🔍 Verificar contra fuentes oficiales</button>'+
      '<div class="veredicto oculto" id="ver">'+
        '<span class="sello">Sin respaldo verificado</span>'+
        '<div class="problema">'+c.aluc.prob+'</div>'+
        '<div class="impacto"><strong>⚠ Impacto profesional:</strong> '+c.aluc.imp+'</div>'+
      '</div></div>';
    $('btnVer').addEventListener('click',()=>{
      $('ver').classList.remove('oculto');
      $('btnVer').style.display='none';
      $('moraleja').classList.remove('oculto');
    });
  } else {
    const docs=c.rag.docs.length
      ? '<div class="docs">'+c.rag.docs.map(d=>'<span class="doc">📄 '+d+'</span>').join('')+'</div>'
      : '<div class="docs"><span class="doc vacio">📂 corpus sin documentos para este tema — y lo dice</span></div>';
    out.innerHTML='<div class="resp rag"><div class="head">📚 Respuesta con RAG · solo desde documentos verificados</div>'+
      '<div>'+c.rag.txt+'</div>'+docs+'</div>';
    $('moraleja').classList.remove('oculto');
  }
}
<\/script>
</body>
</html>

.op.elegida{border-color:var(--tinta);background:#eef2f7;opacity:1}

<body>
<div class="marco">
  <div class="eyebrow">Actividad 7 · Bloque 2 · Copiloto, no oráculo</div>
  <h1>Calibrá tu criterio</h1>
  <p class="instr">Seis situaciones reales de tu trabajo. Para cada una elegí: <strong>🤖 lo delego</strong>, <strong>📝 lo uso de borrador (y reviso)</strong>, o <strong>🚫 no lo uso para esto</strong>. No es un examen: es para autocalibrarte.</p>

  <div class="barra-wrap"><div class="barra" id="barra"></div></div>
  <div id="zona"></div>

  <footer>Taller IAGen · Poder Judicial de Río Negro · 2026</footer>
</div>

<script>
const CASOS=[
 {q:"Te llega un expediente de 300 fojas y necesitás un panorama inicial en una hora.",
  correcta:"borrador",parciales:[],
  fb:{borrador:["ok","Caso de uso ideal: resumir volumen es donde el modelo brilla. Pedile criterios claros (hitos con foja, sin interpretaciones) y revisá que no haya inventado ni omitido nada crítico."],
      delego:["mal","Riesgoso: si delegás sin revisar, podés apoyarte en un resumen con conclusiones que el modelo agregó solo. La revisión humana no es opcional."],

 {q:"Tenés que afirmar en un escrito cuál es el valor vigente del Jus para calcular una multa.",
  correcta:"no uso",parciales:["borrador"],
  fb:{"no uso":["ok","Correcto: es un dato que cambia con frecuencia y el modelo no conoce la versión vigente. Va directo a la fuente oficial del STJRN."],
      borrador:["parcial","Podés usarlo para estructurar el cálculo, pero el número lo sacás vos de la resolución vigente, nunca de la respuesta del modelo."],
      delego:["mal","Si el modelo te da un valor desactualizado y firmás, el error es tuyo. Datos que se actualizan periódicamente = fuente oficial siempre."]}},
 {q:"Recibiste un caso con datos de salud de un menor y querés ayuda para redactar una presentación.",
  correcta:"no uso",parciales:[],
  fb:{"no uso":["ok","Correcto. Datos sensibles de menores no se cargan a plataformas externas: pilar 5 del Protocolo (Acordada 15/24) y Ley 25.326. Anonimizá completamente o redactá sin la herramienta."],
      borrador:["mal","Aunque pidas 'solo la estructura', si pegás los datos del caso en un servicio externo ya los expusiste. La sensibilidad del dato manda sobre la comodidad."],
      delego:["mal","Grave: puede configurar violación del deber de confidencialidad y del Protocolo de Buenas Prácticas. Esto es exactamente lo que la Acordada prohíbe."]}},
 {q:"Tu cliente te pide que le expliques 'en criollo' qué significa la cláusula de rescisión de su contrato.",
  correcta:"borrador",parciales:["delego"],
  fb:{borrador:["ok","Excelente uso: traducir lenguaje técnico a lenguaje claro es fortaleza del modelo. Verificá que la simplificación no haya alterado el alcance jurídico antes de enviarla."],
      delego:["parcial","Aceptable por el bajo riesgo, pero una simplificación puede cambiar el sentido legal sin que se note. Una leída tuya antes de mandar no se negocia."],
      "no uso":["parcial","Es de las tareas más seguras y útiles. Con tu revisión final, el riesgo es mínimo."]}},
 {q:"Necesitás citar textualmente un artículo del CCyCN en un dictamen.",
  correcta:"no uso",parciales:["borrador"],
  fb:{"no uso":["ok","Correcto: para citas textuales, fuente oficial siempre (Infoleg, SAIJ). El modelo parafrasea bien, pero puede cambiar una palabra o un inciso — y en un dictamen eso importa."],
      borrador:["parcial","Como pista para ubicar el artículo, sirve. Pero el texto que transcribís lo copiás de la fuente oficial, no de la respuesta."],
      delego:["mal","Las citas textuales son donde más alucina: agrega incisos, altera números, mezcla redacciones viejas y nuevas. Riesgo profesional alto."]}},
 {q:"Escribiste vos un párrafo para un escrito y querés mejorar su redacción.",
  correcta:"delego",parciales:["borrador"],
  fb:{delego:["ok","Perfecto: pulir estilo de algo que ya pensaste vos es lo más seguro que existe. Pedile tres versiones, elegí y ajustá. El contenido jurídico ya lo controlaste vos."],

];
const LBL={delego:"🤖 Lo delego al modelo",borrador:"📝 Lo uso de borrador y reviso","no uso":"🚫 No lo uso para esto"};
let cur=0,pts=0;
const $=id=>document.getElementById(id);

function render(){
  $('barra').style.width=(cur/CASOS.length*100)+'%';
  if(cur>=CASOS.length)return final();
  const c=CASOS[cur];
  $('zona').innerHTML='<div class="tarjeta"><div class="caso">'+(cur+1)+'. '+c.q+'</div>'+
    '<div class="ops">'+Object.keys(LBL).map(k=>'<button class="op" data-k="'+k+'">'+LBL[k]+'</button>').join('')+'</div>'+
    '<div class="fb" id="fb"></div>'+
    '<button class="btn-sig" id="sig" style="display:none">'+(cur===CASOS.length-1?'Ver resultado':'Siguiente situación')+'</button></div>';

    b.addEventListener('click',()=>{

      document.querySelectorAll('.op').forEach(x=>{

        if(xk===k)x.classList.add('elegida');
      });
      const[tipo,txt]=c.fb[k];
      if(tipo==='ok')pts++;else if(tipo==='parcial')pts+=0.5;
      const fb=$('fb');
      fb.className='fb '+tipo;fb.style.display='block';
      fb.innerHTML='<strong>'+(tipo==='ok'?'✓ Buen criterio. ':tipo==='parcial'?'± Aceptable, con matices. ':'✗ Ojo acá. ')+'</strong>'+txt;
      $('sig').style.display='block';
      $('sig').addEventListener('click',()=>{cur++;render();});
    });
  });
}

function final(){
  $('barra').style.width='100%';
  const p=pts/CASOS.length;
  const msg=p>=0.8?"Tenés muy buen olfato para distinguir dónde el modelo ayuda y dónde es riesgo profesional."
    :p>=0.5?"Vas bien, pero conviene afinar: los datos que cambian con el tiempo y los datos sensibles son las dos zonas rojas."
    :"Releé los feedbacks: el criterio profesional no se delega, y los datos sensibles no salen a servicios externos.";
  $('zona').innerHTML='<div class="tarjeta final">'+
    '<div style="font-size:13px;color:#6b7280">Tu calibración</div>'+
    '<div class="nota">'+(pts%1===0?pts:pts.toFixed(1))+' / '+CASOS.length+'</div>'+
    '<div style="font-size:14.5px;color:#374151;margin-bottom:8px">'+msg+'</div>'+
    '<div class="moraleja"><strong>La brújula de tres preguntas:</strong> ¿es tarea de lenguaje (resumir, traducir, redactar)? → borrador con revisión. ¿Es un dato que cambia o una cita textual? → fuente oficial. ¿Hay datos sensibles o decisión profesional? → no entra al modelo. Y todo lo que sale con tu firma, pasó antes por tus ojos.</div>'+
    '<button class="btn-sig" id="re">↻ Probar otra vez</button></div>';
  $('re').addEventListener('click',()=>{cur=0;pts=0;render();});
}
render();
<\/script>
</body>
</html>

<body>

  <p class="instr">Cargá un caso de ejemplo o escribí el tuyo real. Los 5 bloques se ensamblan abajo en un prompt completo, <strong>listo para copiar y probar</strong>. Tocá "Versión vaga" para comparar.</p>

  <div class="paso"><h3><span class="num">T</span>TAREA</h3><div class="tip">Rol, acción y formato de salida. Lo primero que el modelo necesita.</div><textarea data-k="t" placeholder="Ej.: Actuá como abogado/a redactor/a. Redactá una cláusula..."></textarea></div>
  <div class="paso"><h3><span class="num">C</span>CONTEXTO</h3><div class="tip">Jurisdicción, norma aplicable, partes, antecedentes: lo que no podría adivinar.</div><textarea data-k="c" placeholder="Ej.: Contrato de alquiler comercial en Bariloche, Ley 27.551..."></textarea></div>
  <div class="paso"><h3><span class="num">R</span>REFERENCIAS</h3><div class="tip">Ejemplos del estilo o formato deseado. A qué se tiene que parecer.</div><textarea data-k="r" placeholder='Ej.: Estilo: "TERCERA: PRECIO Y FORMA DE PAGO. Las partes convienen..."'></textarea></div>
  <div class="paso"><h3><span class="num">E</span>EVALUAR</h3><div class="tip">Criterios contra los que vas a leer la respuesta. ¿Qué debe cumplir sí o sí?</div><textarea data-k="e" placeholder="Ej.: Toda cita debe ser verificable. Sin suposiciones presentadas como hechos."></textarea></div>
  <div class="paso"><h3><span class="num">I</span>ITERAR</h3><div class="tip">Tu plan B: qué vas a pedir si la salida no convence.</div><textarea data-k="i" placeholder="Ej.: Si el tono queda informal, pedir reescritura. Si falta cita, exigirla o quitarla."></textarea></div>

  <div class="salida" id="salida"></div>
  <button class="btn" id="btnCopiar">Copiar prompt para probarlo en tu asistente</button>

  <div class="moraleja">
    <strong>Lo que hay que llevarse:</strong> la diferencia entre una respuesta genérica y una útil casi nunca está en el modelo: está en el pedido. Y los pasos E e I son la mitad del método: el prompting es un <strong>ciclo</strong> (pedís → evaluás → refinás), no un disparo único. Esta plantilla es lo que te llevás para el lunes.
  </div>

  <footer>Taller IAGen · Poder Judicial de Río Negro · 2026</footer>
</div>

<script>
const PRESETS=[
 {t:"Actuá como abogado/a redactor/a con experiencia en contratos comerciales. Redactá una cláusula de rescisión anticipada en formato jurídico formal, de máximo 300 palabras.",
  c:"Contrato de alquiler comercial en Bariloche, plazo de 3 años, local gastronómico. Resulta aplicable la Ley 27.551. Las partes quieren prever rescisión con preaviso de 60 días.",
  r:'Seguí este estilo: "TERCERA: PRECIO Y FORMA DE PAGO. Las partes convienen…". Numeración ordinal en mayúsculas, redacción impersonal.',
  e:"Debe incluir: plazo de preaviso, penalidad proporcional, forma de notificación. No inventes normas: si citás un artículo, tiene que existir y ser pertinente.",
  i:"Si la penalidad queda ambigua, pedir reformulación con fórmula de cálculo. Si cita una norma dudosa, exigir verificación o quitarla."},
 {t:"Actuá como relator/a judicial. Hacé un resumen ejecutivo de las actuaciones principales del expediente que voy a pegar a continuación.",
  c:"Expediente civil de daños con foliatura, escritos de ambas partes, dos pericias y resoluciones interlocutorias. Destinatario: magistrado/a que no leerá las 300 fojas.",
  r:"Formato: máximo 8 viñetas cronológicas, cada una con cita de foja. Sección final: 'pendientes detectados'. Sin interpretaciones, solo descripción.",
  e:"Cada hito debe citar foja. Si un dato no surge del texto, marcarlo como 'no surge'. Prohibido agregar conclusiones propias.",
  i:"Si incorpora datos no verificables, pedir corrección señalando la viñeta. Si excede 8 viñetas, pedir condensación. Si confunde fechas, rehacer cronología."},
 {t:"Actuá como asesor/a jurisprudencial. Compará los dos fallos que voy a pegar y armá una tabla de coincidencias y diferencias.",
  c:"Ambos fallos tratan el cómputo de intereses en reintegro de precio por art. 17 LDC, pero llegan a soluciones distintas. Necesito detectar si el conflicto es real o aparente.",
  r:"Tabla de 3 columnas: aspecto / fallo A / fallo B. Al final, una nota con tu análisis del conflicto y qué criterio parece más sólido, fundado en el texto.",
  e:"Todo lo afirmado debe surgir del texto de los fallos. Distinguir holding de obiter dictum. Si un fallo no trata un aspecto, marcar 'no trata'.",
  i:"Si mezcla los fallos, pedir que identifique cada cita con el fallo de origen. Si opina sin fundar en el texto, pedir el párrafo exacto que sostiene cada afirmación."},
 {t:"Actuá como redactor/a del estudio. Escribí una nota para un cliente informándole el estado de su causa, en lenguaje claro.",
  c:"La causa está en etapa de prueba; falta producir una pericia. No hay sentencia ni fecha estimada firme. El cliente no es abogado y está ansioso por novedades.",
  r:"Tono cordial y profesional. Máximo 200 palabras. Sin tecnicismos ('etapa probatoria' → 'estamos reuniendo las pruebas'). Cerrar con el próximo paso concreto.",
  e:"Debe: explicar el estado en lenguaje simple, NO prometer resultado ni plazo exacto, indicar el próximo paso. Verificar que ningún tecnicismo quedó sin traducir.",
  i:"Si promete resultados, suavizar. Si usa jerga, pedir reescritura en lenguaje claro. Si excede 200 palabras, recortar sin perder el próximo paso."}
];
const VAGOS=["redactame una cláusula de rescisión","resumime un expediente","compará dos fallos","escribile una nota a mi cliente"];
const K={t:"TAREA",c:"CONTEXTO",r:"REFERENCIAS",e:"CRITERIOS DE EVALUACIÓN",i:"PLAN DE ITERACIÓN"};
const campos=['t','c','r','e','i'];
const inp={};campos.forEach(f=>inp[f]=document.querySelector('textarea[data-k="'+f+'"]'));
let presetSel=0;
const $=id=>document.getElementById(id);

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}

function render(){
  const out=$('salida');
  if(document.body.classList.contains('modo-vago')){
    out.innerHTML='<span class="k">// Lo que el modelo recibe</span>\\n\\n<span class="mal">"'+VAGOS[presetSel]+'"</span>\\n\\n<span class="ph">→ Resultado probable: genérico, sin jurisdicción, sin formato, y con riesgo de citas inventadas para "completar" lo que no le dijiste.</span>';
    return;
  }
  const v={};campos.forEach(f=>v[f]=inp[f].value.trim());
  if(campos.every(f=>!v[f])){
    out.innerHTML='<span class="k">// Prompt ensamblado</span>\\n<span class="ph">Cargá un ejemplo arriba o escribí tu propio caso.</span>';
    return;
  }
  out.innerHTML='<span class="k">// Prompt ensamblado</span>\\n\\n'+
    campos.filter(f=>v[f]).map(f=>'<span class="k">['+K[f]+']</span>\\n'+esc(v[f])).join('\\n\\n');
}

campos.forEach(f=>inp[f].addEventListener('input',()=>{
  document.querySelectorAll('.preset').forEach(b=>b.classList.remove('activo'));
  render();
}));

document.querySelectorAll('.preset').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.preset').forEach(x=>x.classList.remove('activo'));
    b.classList.add('activo');
    presetSel=+b.dataset.i;
    const p=PRESETS[presetSel];
    campos.forEach(f=>inp[f].value=p[f]);
    render();
  });
});

$('btnVago').addEventListener('click',()=>{
  const on=document.body.classList.toggle('modo-vago');
  $('btnVago').classList.toggle('on',on);
  $('btnVago').textContent=on?'Volver al prompt estructurado':'Ver versión vaga';
  render();
});

$('btnCopiar').addEventListener('click',()=>{
  const v={};campos.forEach(f=>v[f]=inp[f].value.trim());
  const txt=campos.filter(f=>v[f]).map(f=>'['+K[f]+']\\n'+v[f]).join('\\n\\n');
  const fin=()=>{$('btnCopiar').textContent='✓ Copiado — pegalo en tu asistente y evaluá la respuesta';
    setTimeout(()=>$('btnCopiar').textContent='Copiar prompt para probarlo en tu asistente',2400);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(fin).catch(()=>fb(txt,fin));
  } else fb(txt,fin);
});
function fb(t,fin){
  const ta=document.createElement('textarea');ta.value=t;
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');fin();}catch(e){}
  document.body.removeChild(ta);
}
render();
<\/script>
</body>
</html>

<body>
<div class="marco">
  <div class="eyebrow">Actividad 9 · Bloque 2 · Cierre — el ojo crítico</div>
  <h1>¿Respuesta útil o "slop"?</h1>
  <p class="instr">El <em>slop</em> es la salida que <strong>parece</strong> profesional pero está vacía, es genérica o está confiadamente errada. Tu trabajo es olfatearlo antes de que llegue a un escrito. Seis casos: vos decidís.</p>

  <div class="barra-wrap"><div class="barra" id="barra"></div></div>
  <div id="zona"></div>

  <footer>Taller IAGen · Poder Judicial de Río Negro · 2026</footer>
</div>

<script>
const CASOS=[
 {p:"Resumime los puntos clave del expediente sobre el incumplimiento de garantía.",
  r:"Para resumir los puntos clave del expediente sobre el incumplimiento de garantía, es importante considerar varios aspectos relevantes. En primer lugar, el expediente trata sobre un incumplimiento de garantía. En segundo lugar, este incumplimiento es relevante porque afecta los derechos de las partes. En tercer lugar, se recomienda analizar la cuestión en detalle. Espero que este resumen haya sido de utilidad.",
  slop:true,
  fbT:"Slop clásico: forma sin contenido.",
  fbX:"Repite la pregunta simulando estructura ('en primer lugar…') pero no aporta un solo dato: ni una foja, ni una fecha, ni una parte, ni una norma. Si pegás esto en un informe, queda en evidencia al instante.",
  m:[["m-mal","Tautológico"],["m-mal","Cero datos"],["m-mal","Sin fojas ni fechas"],["m-mal","Cierre de relleno"]]},
 {p:"¿Qué dice textualmente el art. 1091 del CCyCN?",
  r:"No puedo garantizarte el texto exacto, así que no te lo voy a transcribir. Lo que sí puedo decirte: el art. 1091 del CCyCN regula la imprevisión — permite a la parte perjudicada pedir la resolución o adecuación del contrato ante una alteración extraordinaria de las circunstancias, ajena a su riesgo. Para citarlo textualmente en tu dictamen, copialo de Infoleg o SAIJ.",
  slop:false,
  fbT:"Buena respuesta: parafrasea, no inventa, deriva a la fuente.",
  fbX:"Evita la trampa de 'completar' el texto exacto, ofrece una paráfrasis honesta y deriva explícitamente a la fuente oficial. Esto es exactamente lo que querés cuando trabajás con normativa.",
  m:[["m-bien","No inventa el texto"],["m-bien","Paráfrasis honesta"],["m-bien","Deriva a Infoleg/SAIJ"]]},
 {p:"Analizame la procedencia del daño punitivo en este caso.",
  r:"Tras un exhaustivo análisis de la documentación aportada, concluyo que el daño punitivo es plenamente procedente conforme el art. 52 bis LDC, con un tope actualizado de $ 215.000.000 según la Resolución SCI 41/2025, y siguiendo el criterio unánime de la CSJN en \\"Territorio c/ Plan Óvalo\\" (Fallos 346:1112). Se recomienda solicitar el máximo legal sin reservas.",
  slop:true,
  fbT:"Slop peligroso: confianza absoluta con datos sin verificar.",
  fbX:"Tres banderas rojas: dice 'exhaustivo análisis' sin haber recibido documento alguno; da una cifra y una resolución que no podés verificar desde la respuesta; y cita un fallo de CSJN con tomo y foja que puede ser inventado. La tranquilidad del tono es lo que más debe alarmarte: 'sin reservas' no existe en derecho.",
  m:[["m-mal","'Exhaustivo' sin documentos"],["m-mal","Cifra no verificada"],["m-mal","Cita con formato perfecto"],["m-mal","Falsa certeza"]]},
 {p:"Redactá un borrador de carta documento por incumplimiento contractual.",
  r:"CARTA DOCUMENTO\\n\\nAl Sr./Sra.: [nombre — completar]\\nDomicilio: [completar]\\n\\nIntimo a Ud. en el plazo de [X] días a cumplir la obligación asumida en el contrato de fecha [completar], consistente en [detallar prestación], bajo apercibimiento de accionar judicialmente por cumplimiento o resolución, con más daños y perjuicios.\\n\\nQueda Ud. debidamente notificado/a.\\n[Firma — completar]",
  slop:false,
  fbT:"Buena respuesta: estructura sólida, campos pendientes marcados.",
  fbX:"Estructura correcta de intimación, lenguaje apropiado, y —clave— marca explícitamente con [corchetes] todo lo que el humano debe completar, en vez de inventar nombres, plazos o fechas. Es un borrador honesto, listo para tu revisión.",
  m:[["m-bien","Estructura correcta"],["m-bien","No inventa datos"],["m-bien","Campos [a completar]"],["m-bien","Listo para revisión"]]},
 {p:"Haceme un análisis de riesgos procesales de mi caso.",
  r:"RIESGOS PROCESALES IDENTIFICADOS:\\n• Riesgo probatorio: la prueba podría resultar insuficiente.\\n• Riesgo de plazos: existe la posibilidad de que algún plazo venza.\\n• Riesgo de costas: en caso de rechazo, podrían imponerse costas.\\n• Riesgo recursivo: la contraria podría apelar.\\nSe recomienda un seguimiento cuidadoso del expediente.",
  slop:true,
  fbT:"Slop genérico: vale para cualquier expediente del país.",
  fbX:"Ni un solo dato del caso concreto: 'la prueba podría ser insuficiente' y 'algún plazo podría vencer' aplican a todo juicio que haya existido. El modelo no recibió información del caso y rellenó con vaguedades de aspecto profesional. El test infalible: ¿esta respuesta cambiaría si el caso fuera otro? Si no, es slop.",
  m:[["m-mal","Genérico total"],["m-mal","Sin datos del caso"],["m-mal","Aplica a cualquier juicio"]]},
 {p:"¿Qué plazo tengo para apelar la sentencia definitiva en el proceso ordinario civil de Río Negro?",
  r:"En el proceso ordinario civil, el plazo general de apelación contra la sentencia definitiva surge del CPCC de Río Negro. Antes de computarlo, verificá dos cosas en tu caso: (1) el tipo de proceso — los sumarísimos y regímenes especiales tienen plazos distintos —, y (2) la fecha y validez de la notificación, porque desde ahí corre el cómputo en días hábiles. El número exacto confirmalo en el texto vigente del código: te indico el capítulo de recursos para que lo verifiques directo en la fuente.",
  slop:false,
  fbT:"Buena respuesta: orienta, advierte salvedades y exige verificación.",
  fbX:"En vez de arriesgar un número que puede estar mal, señala el camino: dónde está la respuesta, qué condiciones pueden cambiarla (tipo de proceso, notificación) y qué verificar antes de actuar. Información útil + advertencia explícita = lo contrario del slop.",
  m:[["m-bien","Salvedades pertinentes"],["m-bien","Exige fuente vigente"],["m-bien","No arriesga el dato crítico"]]}
];
let cur=0,pts=0;
const $=id=>document.getElementById(id);

function render(){
  $('barra').style.width=(cur/CASOS.length*100)+'%';
  if(cur>=CASOS.length)return final();
  const c=CASOS[cur];
  $('zona').innerHTML='<div class="tarjeta">'+
    '<div class="prompt-box"><div class="h">PROMPT DEL USUARIO</div>'+c.p+'</div>'+
    '<div class="respuesta"><div class="h">RESPUESTA DEL MODELO</div>'+c.r+'</div>'+
    '<div class="veredictos">'+
      '<button class="ver buena" data-v="buena">✅ Respuesta útil</button>'+
      '<button class="ver slop" data-v="slop">⚠️ Es slop</button>'+
    '</div><div class="fb oculto" id="fb"></div></div>';
  document.querySelectorAll('.ver').forEach(b=>{
    b.addEventListener('click',()=>{
      const dijoSlop=b.dataset.v==='slop';
      const acerto=dijoSlop===c.slop;
      if(acerto)pts++;
      document.querySelectorAll('.ver').forEach(x=>{
        x.disabled=true;
        if((c.slop&&x.dataset.v==='slop')||(!c.slop&&x.dataset.v==='buena'))x.classList.add('correcta');
      });
      const fb=$('fb');fb.classList.remove('oculto');
      fb.innerHTML='<span class="sello '+(c.slop?'s-rojo':'s-verde')+'">'+(c.slop?'Slop detectado':'Respuesta útil')+'</span>'+
        '<div class="txt"><strong style="color:'+(acerto?'var(--verde)':'var(--sello)')+'">'+(acerto?'✓ Acertaste. ':'✗ Mirá esto: ')+'</strong>'+c.fbT+'</div>'+
        '<div class="txt">'+c.fbX+'</div>'+
        '<div class="marcas">'+c.m.map(([cl,t])=>'<span class="marca '+cl+'">'+t+'</span>').join('')+'</div>'+
        '<button class="btn-sig" id="sig">'+(cur===CASOS.length-1?'Ver resultado':'Siguiente caso')+'</button>';
      $('sig').addEventListener('click',()=>{cur++;render();});
    });
  });
}

function final(){
  $('barra').style.width='100%';
  $('zona').innerHTML='<div class="tarjeta final">'+
    '<div style="font-size:13px;color:#6b7280">Tu ojo crítico</div>'+
    '<div class="nota">'+pts+' / '+CASOS.length+'</div>'+
    '<div class="moraleja"><strong>La regla práctica del olfato:</strong> si una respuesta no cita foja ni norma verificable, si suena igual de bien para cualquier caso, o si transmite certeza absoluta donde el derecho tiene matices — es slop. Y el slop más peligroso no es el vacío: es el que viene con cifras y citas de formato perfecto. Esos son los que se verifican siempre, sin excepción.</div>'+
    '<button class="btn-sig" id="re" style="margin-top:12px">↻ Entrenar de nuevo</button></div>';
  $('re').addEventListener('click',()=>{cur=0;pts=0;render();});
}
render();
<\/script>
</body>
</html>

<script>
const TAREAS=[
 {label:"Verificar las citas de un escrito",
  meta:"Antes de presentar este escrito, verificá que las 6 citas de jurisprudencia y normativa existan y digan lo que el escrito afirma.",
  chat:{out:"He revisado el escrito y las citas se ven correctas. La jurisprudencia mencionada es pertinente y la normativa citada respalda adecuadamente los argumentos. El escrito está listo para presentar.",

   {et:"👁 Observa",det:"4 coinciden. 1 dice lo CONTRARIO de lo afirmado: el escrito invierte el criterio del fallo sobre intereses."},

  out:"INFORME DE VERIFICACIÓN DE CITAS\\n✔ 4 citas verificadas: existen y coinciden con lo afirmado (links a fuente).\\n✖ 1 cita INEXISTENTE: \\"Suárez c/ Andina Motors\\" — no aparece en CNCom ni en bases oficiales. Recomiendo eliminarla.\\n⚠ 1 cita INVERTIDA: el fallo real sostiene lo contrario sobre el cómputo de intereses (transcribo el párrafo textual).\\n\\nNo modifiqué el escrito. Espero tus instrucciones."},
 {label:"Resumen ejecutivo de un expediente de 300 fojas",
  meta:"Resumir el expediente completo para el/la magistrado/a: hitos con cita de foja, sin interpretaciones, máximo 8 viñetas.",
  chat:{out:"El expediente trata sobre un reclamo de daños por incumplimiento de garantía de un vehículo. La documentación está completa y los argumentos de la actora se encuentran debidamente fundados. Se sugiere hacer lugar a la demanda.",
   warn:"⚠ Sin fojas · Sin cronología · 'Se sugiere hacer lugar' opina sin que nadie se lo pida"},
  pasos:[
   {et:"🎯 Planifica",det:"Sub-tareas: recorrer foliatura → extraer hitos con fecha y foja → detectar faltantes → sintetizar sin opinar."},
   {et:"🔍 Actúa: lee el expediente",det:"Recorre las 300 fojas. Marca: demanda (fs. 1), contestación (fs. 48), pericia mecánica (fs. 112), alegatos (fs. 270)."},
   {et:"👁 Observa",det:"7 hitos identificados. Detecta faltante: la pericia contable ordenada a fs. 130 no obra agregada."},
   {et:"✍️ Actúa: redacta",det:"8 viñetas cronológicas, cada una con su foja. Sección final: 'pendientes detectados'."},
   {et:"🧪 Autoevalúa",det:"Checklist: ¿≤8 viñetas? Sí. ¿Todas con foja? Una sin foja → corrige. ¿Opiniones? Detecta un 'parece fundado' → lo elimina."},
   {et:"🔁 Itera",det:"Versión 2: foja agregada, opinión eliminada. Re-chequea: 5/5 criterios cumplidos."},
   {et:"✅ Entrega",det:"Resumen verificado contra los criterios. El mérito lo evalúa el humano."}],
  out:"RESUMEN EJECUTIVO\\n• fs. 1 — Demanda: daños por fallas reiteradas de vehículo 0km.\\n• fs. 48 — Contestación: niega nexo causal, ofrece pericia.\\n• fs. 112 — Pericia mecánica: constata 19 ingresos a taller.\\n• fs. 130 — Se ordena pericia contable. ⚠ NO OBRA AGREGADA.\\n• fs. 270 — Alegatos de ambas partes.\\nPENDIENTE: pericia contable sin producir. Sin opiniones sobre el mérito."}];

let sel=null,corriendo=false;
const $=id=>document.getElementById(id);

const tb=$('tareas');
TAREAS.forEach((t,i)=>{
  const b=document.createElement('button');
  b.textContent=t.label;
  b.addEventListener('click',()=>{
    if(corriendo)return;
    sel=i;
    document.querySelectorAll('.tareas button').forEach((x,j)=>x.classList.toggle('activa',j===i));
    $('meta').style.display='block';
    $('metaTxt').textContent=t.meta;
    $('outChat').style.display='none';$('outAg').style.display='none';
    $('pasos').innerHTML='';
    $('tChat').textContent='0 turnos internos';$('tAg').textContent='0 turnos internos';
    $('moraleja').style.display='none';
    $('runChat').disabled=false;$('runAg').disabled=false;
  });
  tb.appendChild(b);
});

function revelar(){
  const c=$('outChat').style.display==='block';
  const a=$('outAg').style.display==='block';
  if(c&&a)$('moraleja').style.display='block';
}

$('runChat').addEventListener('click',()=>{
  if(sel===null)return;
  const t=TAREAS[sel];
  $('tChat').textContent='1 turno · respuesta directa';
  const o=$('outChat');
  o.style.display='block';
  o.innerHTML='<div class="h">RESPUESTA</div>'+t.chat.out+'<div class="alerta">'+t.chat.warn+'</div>';
  revelar();
});

$('runAg').addEventListener('click',async()=>{
  if(sel===null||corriendo)return;
  corriendo=true;$('runAg').disabled=true;
  const t=TAREAS[sel];
  const ul=$('pasos');ul.innerHTML='';
  $('outAg').style.display='none';
  t.pasos.forEach(p=>{
    const li=document.createElement('li');
    li.className='paso';
    li.innerHTML='<span class="et">'+p.et+'</span><span class="det">'+p.det+'</span>';
    ul.appendChild(li);
  });
  const lis=[...ul.children];
  const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  for(let i=0;i<lis.length;i++){
    if(i>0){lis[i-1].classList.remove('activo');lis[i-1].classList.add('hecho');}
    lis[i].classList.add('activo');
    $('tAg').textContent=(i+1)+' turnos internos';
    await new Promise(r=>setTimeout(r,reduce?60:900));
  }
  lis[lis.length-1].classList.remove('activo');
  lis[lis.length-1].classList.add('hecho');
  const o=$('outAg');
  o.style.display='block';
  o.innerHTML='<span class="sello">Esperando aprobación humana</span><div class="h">ENTREGA</div>'+t.out;
  corriendo=false;$('runAg').disabled=false;
  revelar();
});
<\/script>
</body>
