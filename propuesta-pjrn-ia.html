  // ── NIVEL 1 · PRIMEROS USOS ─────────────────────────────────────
  { id: "p1", level: "inicio", domain: "Primeros pasos", title: "Explicación sin apuro", objective: "Aprender una función nueva sin sentirse expuesto.", prompt: "Actuá como instructor paciente. Necesito aprender a usar [herramienta o función] desde cero. Explicame en pasos cortos, sin jerga, con una sola acción por paso. Después de cada paso decime qué debería ver en pantalla y cuál es el error más frecuente en ese punto.", why: "Convierte una dificultad tecnológica en una secuencia practicable y sin vergüenza." },
  { id: "p2", level: "inicio", domain: "Primeros pasos", title: "Traducir jerga técnica", objective: "Entender un término informático que aparece en el trabajo.", prompt: "Explicame qué significa [término] como si se lo explicaras a alguien que trabaja en una oficina judicial y no tiene formación técnica. Usá una analogía del ámbito administrativo o judicial. Después decime en qué situaciones concretas de mi trabajo me lo puedo cruzar.", why: "La analogía del propio ámbito fija el concepto mejor que la definición." },
  { id: "p3", level: "inicio", domain: "Primeros pasos", title: "Qué le puedo pedir", objective: "Descubrir usos posibles para una tarea propia.", prompt: "Trabajo en [función] de una oficina judicial. Una de mis tareas recurrentes es [describir la tarea]. Sin darme todavía ninguna solución, listá quince formas distintas en las que un asistente de IA podría ayudarme con eso, ordenadas de menor a mayor riesgo. Marcá cuáles requieren verificación obligatoria.", why: "Es el mejor primer prompt: genera el mapa de posibilidades antes de elegir una." },
  { id: "p4", level: "inicio", domain: "Papel a digital", title: "De apuntes a minuta", objective: "Aprovechar notas manuscritas de una reunión.", prompt: "Te voy a pasar el texto extraído de notas manuscritas. Actuá como asistente de organización documental. Convertilas en una minuta con secciones: tema, hechos mencionados, dudas abiertas, compromisos asumidos, próximos pasos y datos a verificar. No agregues nada que no esté en la nota. Marcá con [ilegible] lo que no se entienda.", why: "Respeta el hábito de tomar apuntes y lo transforma en material reutilizable." },
  { id: "p5", level: "inicio", domain: "Papel a digital", title: "Foto de pizarrón a tareas", objective: "Convertir una reunión de equipo en pendientes concretos.", prompt: "Te adjunto la foto de un pizarrón de planificación. Transcribí lo que se lee y armá una lista de tareas con: qué hay que hacer, quién aparece asignado si figura, y qué quedó sin definir. No inventes responsables ni plazos que no estén escritos. Al final listá lo que no pudiste leer.", why: "La prohibición de inferir es lo que hace confiable la transcripción." },
  { id: "p6", level: "inicio", domain: "Papel a digital", title: "Índice de una carpeta física", objective: "Ordenar documentación en papel antes de digitalizarla.", prompt: "Te voy a describir uno por uno los documentos de una carpeta. Armá un índice con: número de orden, tipo de documento, fecha, origen y una descripción de una línea. Al final sugerí un criterio de nomenclatura para cuando los escanee, con formato de nombre de archivo.", why: "El criterio de nomenclatura vale más que el índice: sirve para todas las carpetas siguientes." },
  { id: "p7", level: "inicio", domain: "Privacidad", title: "Revisión previa de datos", objective: "Preparar un texto antes de usarlo en un asistente público.", prompt: "Actuá como asistente de protección de datos. Te voy a pegar un texto de práctica. Listá qué elementos deberían anonimizarse antes de usarlo en una IA pública, agrupados por categoría: personas, documentos de identidad, domicilios, contactos, expedientes, fechas identificatorias y datos de salud. Proponé una versión con etiquetas genéricas y consistentes.", why: "Instala la rutina prudente sin frenar el aprendizaje." },
  { id: "p8", level: "inicio", domain: "Privacidad", title: "Test de reidentificación", objective: "Comprobar si un texto anonimizado sigue identificando a alguien.", prompt: "Este texto ya fue anonimizado con etiquetas. Actuá como alguien que quiere descubrir de quién se trata. Decime qué combinación de datos que quedaron —localidad, fecha, profesión, circunstancia, montos— permitiría reconocer a la persona en una comunidad chica. No intentes identificarla: solo señalá qué habría que alterar además.", why: "El riesgo real no está en los nombres: está en la combinación de datos residuales." },
  { id: "p9", level: "inicio", domain: "Borradores", title: "Esquema antes de redactar", objective: "Ordenar ideas sin producir texto todavía.", prompt: "A partir de estas notas armá solo un esquema de trabajo. No redactes. Separá: hechos, documentación disponible, puntos dudosos, líneas de análisis posibles y datos faltantes. Marcá con [verificar] todo lo que no esté respaldado por el material que te di.", why: "Fuerza la etapa donde la corrección rinde más." },
  { id: "p10", level: "inicio", domain: "Borradores", title: "Ampliar un punteo propio", objective: "Pasar de ideas sueltas a párrafos ordenados.", prompt: "Te paso un punteo de ideas propias. Desarrollalas en párrafos manteniendo mi orden y sin agregar contenido nuevo. Si una idea está incompleta, escribí [falta desarrollo] en lugar de completarla vos. Conservá mi vocabulario técnico.", why: "Prohibir el agregado convierte a la IA en redactora y no en autora." },
  { id: "p11", level: "inicio", domain: "Lectura", title: "Resumen con límites declarados", objective: "Comprimir un documento largo sin perder advertencias.", prompt: "Resumí el documento adjunto en no más de 300 palabras. Estructura: partes, objeto, hechos relevantes en orden cronológico, pretensiones y estado procesal. Si algún dato no surge del texto, escribí «no consta» en lugar de inferirlo. Al final agregá una lista de lo que quedó fuera del resumen por falta de información.", why: "Un resumen que declara sus huecos es verificable; uno que los tapa, no." },
  { id: "p12", level: "inicio", domain: "Lectura", title: "Lectura en tres niveles", objective: "Decidir rápido cuánto tiempo dedicarle a un documento.", prompt: "Del documento adjunto dame tres versiones: una de dos líneas, una de un párrafo y una de una carilla. Cada versión tiene que servir para una decisión distinta: si me interesa, si tengo que actuar, y qué tengo que hacer exactamente.", why: "Tres profundidades permiten triar sin leer todo dos veces." },
  { id: "p13", level: "inicio", domain: "Lectura", title: "Glosario de un documento", objective: "Entrar en una materia desconocida.", prompt: "Del documento adjunto extraé todos los términos técnicos, siglas y expresiones que alguien ajeno a esta materia no entendería. Armá un glosario con la definición según se usa en este texto, no la general. Ordenalo por orden de aparición.", why: "Definir según el uso del texto evita traer sentidos de otra rama." },
  { id: "p14", level: "inicio", domain: "Mesa de entradas", title: "Clasificar una presentación", objective: "Determinar qué tipo de escrito llegó y qué corresponde.", prompt: "Te pego el encabezado y el objeto de una presentación. Identificá: tipo de escrito, qué solicita concretamente, si invoca alguna norma y si menciona algún plazo. Si algo no surge del texto escribí «no consta». No opines sobre la procedencia.", why: "Separar la identificación de la valoración acelera la mesa sin invadir criterio." },
  { id: "p15", level: "inicio", domain: "Mesa de entradas", title: "Extraer datos para carga", objective: "Preparar la carga en sistema sin releer el escrito.", prompt: "Del escrito adjunto extraé en formato de lista los datos que se cargan en sistema: tipo de presentación, partes con su rol, letrados intervinientes, documentación acompañada y peticiones concretas. Un dato por línea. Lo que no figure, «no consta».", why: "El formato de lista se transcribe directo, sin volver al documento." },
  { id: "p16", level: "inicio", domain: "Escritura", title: "Correo institucional breve", objective: "Redactar una comunicación interna clara.", prompt: "Actuá como redactor institucional. Escribí un correo interno de no más de 120 palabras para comunicar [asunto]. Tono formal pero directo, sin fórmulas de cortesía extensas. Que la primera oración diga qué se necesita y para cuándo. Cerrá con una sola acción concreta esperada del destinatario.", why: "La brevedad con acción explícita reduce el ida y vuelta." },
  { id: "p17", level: "inicio", domain: "Escritura", title: "Tres tonos para el mismo mensaje", objective: "Elegir el registro adecuado antes de enviar.", prompt: "Escribí este mensaje en tres versiones: una formal institucional, una cordial de trabajo entre pares, y una firme pero respetuosa para reclamar algo demorado. Mismo contenido en las tres. Después decime en qué situación conviene cada una.", why: "Ver las tres juntas es más rápido que corregir el tono a ciegas." },
  { id: "p18", level: "inicio", domain: "Escritura", title: "Reescribir un párrafo trabado", objective: "Destrabar una redacción que no sale.", prompt: "Este párrafo no me termina de cerrar. Dame cinco reformulaciones distintas: una más breve, una más precisa, una más simple, una más formal y una que reordene la información. No cambies el contenido. Después decime qué gana y qué pierde cada una.", why: "Cinco versiones con su análisis enseñan más que una versión corregida." },
  { id: "p19", level: "inicio", domain: "Lenguaje claro", title: "Traducir sin cambiar el sentido", objective: "Hacer comprensible un párrafo técnico.", prompt: "Reescribí el siguiente párrafo en lenguaje claro para una persona sin formación jurídica, sin alterar el sentido ni omitir condiciones. Conservá los términos técnicos que no tengan equivalente y explicalos entre paréntesis la primera vez. Después indicá qué información del original quedó necesariamente simplificada.", why: "El control está en la última pregunta: obliga a declarar qué se perdió." },
  { id: "p20", level: "inicio", domain: "Lenguaje claro", title: "Versión para la persona destinataria", objective: "Explicar una resolución a quien la recibe.", prompt: "A partir de esta resolución, escribí una explicación de media carilla dirigida a la persona alcanzada por ella. Debe decir: qué se resolvió, qué significa en la práctica, qué tiene que hacer y en qué plazo, y a dónde puede consultar. Sin latinismos. Aclarando que el texto que rige es el de la resolución.", why: "La aclaración final evita que la versión simple se tome por la decisión." },
  { id: "p21", level: "inicio", domain: "Verificación", title: "Lista de control propia", objective: "Revisar el trabajo propio antes de elevarlo.", prompt: "Actuá como revisor técnico. A partir de este tipo de documento, armá una lista de verificación de diez puntos que yo debería controlar antes de elevarlo. Cada punto tiene que poder responderse con sí o no, sin zonas grises. Ordenalos de mayor a menor consecuencia si el punto falla.", why: "Convierte la revisión en un procedimiento y no en una impresión." },
  { id: "p22", level: "inicio", domain: "Verificación", title: "Qué habría que comprobar", objective: "Identificar lo verificable en un texto propio.", prompt: "Leé este texto y listá todo lo que sería necesario comprobar antes de firmarlo: normas citadas, fechas, montos, plazos, datos de partes y referencias a constancias. Para cada uno indicá dónde se comprueba. No verifiques nada vos: solo armá la lista.", why: "Separar la lista de la verificación evita que el modelo simule haber comprobado." },
  { id: "p23", level: "inicio", domain: "Búsqueda", title: "Diseñar la consulta, no pedir la respuesta", objective: "Usar la IA como planificadora de búsqueda.", prompt: "Necesito encontrar [tipo de documento] sobre [tema] en [portal oficial]. No me des el resultado ni cites fuentes: dame cinco consultas de búsqueda con operadores, con sinónimos del vocabulario técnico y variantes de redacción. Explicá en una línea qué busca cada una y cuál conviene probar primero.", why: "Separa lo que la IA hace bien de lo que hace mal." },
  { id: "p24", level: "inicio", domain: "Búsqueda", title: "Cómo se dice en esta materia", objective: "Encontrar el vocabulario correcto para buscar.", prompt: "Quiero buscar sobre [describir el problema en palabras comunes]. Decime con qué términos técnicos se nombra esto en el derecho argentino, qué sinónimos y variantes existen, y cómo lo llamarían en distintas jurisdicciones. No me des fuentes: solo el vocabulario para buscar.", why: "La mitad de las búsquedas fallidas fallan por el término, no por el buscador." },
  { id: "p25", level: "inicio", domain: "Gestión", title: "Ordenar el día", objective: "Priorizar pendientes con criterio explícito.", prompt: "Te paso mi lista de pendientes de la semana. Ordenalos según tres criterios que quiero que apliques en este orden: vencimiento próximo, consecuencia si no se hace, y tiempo estimado. Marcá cuáles se pueden delegar y cuáles necesitan que esté yo. No agregues tareas.", why: "Explicitar el orden de los criterios evita una priorización arbitraria." },
  { id: "p26", level: "inicio", domain: "Gestión", title: "Preparar una reunión", objective: "Llegar con la reunión pensada.", prompt: "Voy a una reunión sobre [tema] con [quiénes]. Armame: tres objetivos posibles para la reunión, cinco preguntas que convendría hacer, dos temas que probablemente aparezcan y no estoy previendo, y una lista de qué debería llevar resuelto de antemano.", why: "Los temas que uno no está previendo son el verdadero aporte." },
  { id: "p27", level: "inicio", domain: "Atención al público", title: "Respuesta a una consulta frecuente", objective: "Contestar con claridad sin dar asesoramiento.", prompt: "Redactá una respuesta a esta consulta del público. Debe explicar el procedimiento y los requisitos formales, sin asesorar sobre la conveniencia ni anticipar resultados. Incluí dónde consultar y qué documentación llevar. Cerrá aclarando que no constituye asesoramiento jurídico.", why: "El límite entre informar y asesorar tiene que estar en el prompt, no en la corrección posterior." },
  { id: "p28", level: "inicio", domain: "Atención al público", title: "Instructivo de un trámite", objective: "Documentar un procedimiento para quien lo hace por primera vez.", prompt: "Convertí esta descripción de un trámite en un instructivo paso a paso. Cada paso: qué hacer, dónde, qué llevar, cuánto demora y qué error es frecuente. Agregá al final las tres preguntas que más se hacen y su respuesta.", why: "El error frecuente por paso es lo que ningún instructivo tiene y todos necesitan." },
  { id: "p29", level: "inicio", domain: "Capacitación", title: "Explicar un tema al equipo", objective: "Preparar una explicación breve para colegas.", prompt: "Tengo que explicarle a mi equipo [tema] en diez minutos. Armame: una analogía de apertura, tres ideas centrales con un ejemplo cada una, el error más común de comprensión y una pregunta para verificar si se entendió. Sin diapositivas: para decirlo hablando.", why: "La pregunta de verificación es lo que convierte una charla en una capacitación." },
  { id: "p30", level: "inicio", domain: "Capacitación", title: "Autoevaluación sobre un material", objective: "Comprobar si entendiste lo que leíste.", prompt: "A partir del material adjunto, generá diez preguntas de opción múltiple con cuatro opciones cada una. Que dos preguntas sean de aplicación a un caso, no de memoria. Indicá la respuesta correcta y en qué parte del material está, pero recién al final y todas juntas.", why: "Poner las respuestas al final obliga a responder antes de mirar." },
  { id: "p31", level: "inicio", domain: "Datos", title: "Estructurar una lista desordenada", objective: "Convertir texto suelto en una tabla usable.", prompt: "Te paso una lista escrita de corrido. Convertila en una tabla con las columnas que detectes que corresponden. Si un registro está incompleto, dejá la celda vacía en lugar de completarla. Después decime qué columnas convendría agregar para que la tabla sea útil.", why: "La celda vacía es un dato: la celda inventada es un error." },
  { id: "p32", level: "inicio", domain: "Datos", title: "Fórmula de planilla explicada", objective: "Resolver un cálculo sin saber la sintaxis.", prompt: "Necesito que una planilla haga lo siguiente: [describir en palabras]. Dame la fórmula, explicá qué hace cada parte, y decime qué pasa si una celda está vacía o tiene texto en lugar de número. Después dame una versión más simple aunque sea menos elegante.", why: "La versión simple es la que después podés modificar sin ayuda." },
  { id: "p33", level: "inicio", domain: "Aprendizaje", title: "Entender un error del sistema", objective: "Interpretar un mensaje técnico.", prompt: "Me apareció este mensaje de error: [pegar]. Explicame en lenguaje común qué significa, qué lo suele causar, qué puedo intentar yo, y en qué punto conviene que llame a soporte en lugar de seguir probando.", why: "El límite de hasta dónde intentar solo es la parte más útil de la respuesta." },
  { id: "p34", level: "inicio", domain: "Aprendizaje", title: "Preguntas que no me animo a hacer", objective: "Cubrir lagunas básicas sin exponerse.", prompt: "Trabajo en [función] y hay cosas básicas de [tema] que nunca terminé de entender y me da vergüenza preguntar. Hacé de cuenta que soy alguien que recién empieza: explicame los cinco conceptos que se dan por sabidos en este ámbito y que nadie explica.", why: "Los conceptos que se dan por sabidos son los que más huecos dejan." },
  { id: "p35", level: "inicio", domain: "Accesibilidad", title: "Texto alternativo y lectura fácil", objective: "Hacer accesible un material propio.", prompt: "Adaptá este texto a lectura fácil: oraciones cortas, una idea por oración, vocabulario común, sin metáforas. Mantené toda la información sustancial. Después listá qué partes fueron difíciles de adaptar y por qué.", why: "Lo difícil de adaptar suele ser lo que estaba mal escrito en el original." },

  // ── NIVEL 2 · TRABAJO CON PRECISIÓN ─────────────────────────────
  { id: "p36", level: "trabajo", domain: "Análisis documental", title: "Separar hechos de inferencias", objective: "Distinguir qué está afirmado de qué está probado.", prompt: "Analizá el texto adjunto y devolvé una tabla de cuatro columnas: afirmación, tipo (hecho afirmado / hecho acreditado / inferencia / valoración), elemento de respaldo citado en el texto, y observación. Si una afirmación no tiene respaldo en el propio texto, escribilo explícitamente. No completes con conocimiento general.", why: "Es la operación que más errores previene en la lectura de un escrito." },
  { id: "p37", level: "trabajo", domain: "Análisis documental", title: "Línea de tiempo con respaldo", objective: "Reconstruir la secuencia de hechos y actuaciones.", prompt: "Construí una línea de tiempo a partir del documento adjunto. Formato: fecha, hecho o actuación, foja o referencia del texto donde consta. Ordená cronológicamente. Cuando una fecha sea aproximada o esté inferida, marcala con [aprox]. Al final listá los períodos sobre los que el documento no dice nada.", why: "El listado final de vacíos suele ser más útil que la línea misma." },
  { id: "p38", level: "trabajo", domain: "Análisis documental", title: "Comparar dos versiones", objective: "Detectar diferencias entre documentos relacionados.", prompt: "Compará los dos textos adjuntos. Devolvé tres bloques: coincidencias sustanciales, diferencias de contenido con la cita textual de cada versión, y elementos presentes en uno y ausentes en el otro. No opines sobre cuál es mejor. Si una diferencia es solo de redacción sin cambio de sentido, clasificala aparte.", why: "La instrucción de no opinar evita que la comparación se convierta en recomendación." },
  { id: "p39", level: "trabajo", domain: "Análisis documental", title: "Mapa de pretensiones y respuestas", objective: "Controlar que todo lo pedido tenga tratamiento.", prompt: "Del material adjunto extraé todas las pretensiones planteadas por cada parte y, para cada una, si recibió respuesta en el documento posterior. Tabla: pretensión, quién la plantea, dónde consta, si fue respondida, dónde. Marcá las que quedaron sin tratamiento.", why: "Las pretensiones sin tratamiento son el defecto más costoso de detectar tarde." },
  { id: "p40", level: "trabajo", domain: "Análisis documental", title: "Inventario de prueba", objective: "Ordenar qué prueba hay y qué acredita cada una.", prompt: "Listá toda la prueba mencionada en el documento adjunto. Tabla: medio de prueba, quién la ofrece, si consta producida, qué hecho pretende acreditar según el texto, y dónde se la menciona. Si el texto no dice qué pretende acreditar, escribí «no explicitado».", why: "«No explicitado» es un hallazgo, no un vacío del análisis." },
  { id: "p41", level: "trabajo", domain: "Análisis documental", title: "Resumen para quien no leyó nada", objective: "Poner en tema a un colega que se suma.", prompt: "Escribí un informe de situación de una carilla para alguien que se incorpora al trabajo sobre este asunto y no leyó nada. Debe incluir: de qué se trata, en qué estado está, qué está discutido, qué está resuelto, qué falta y cuál es el próximo paso. Marcá con [verificar] lo que no surja del material.", why: "Es también el mejor resumen para uno mismo tres meses después." },
  { id: "p42", level: "trabajo", domain: "Escritos y proyectos", title: "Control de estructura normativa", objective: "Verificar requisitos formales de una resolución.", prompt: "Actuá como auditor de estructura. Verificá si el proyecto adjunto cumple uno por uno los requisitos de [artículo aplicable]. Devolvé una tabla: inciso, requisito, cumple sí/no, fragmento del texto donde consta o «no consta». No evalúes el criterio jurídico de fondo, solo la presencia de cada elemento exigido.", why: "Los incisos del artículo son una rúbrica binaria de origen normativo." },
  { id: "p43", level: "trabajo", domain: "Escritos y proyectos", title: "Coherencia entre hechos y decisión", objective: "Detectar saltos lógicos en la fundamentación.", prompt: "Analizá la cadena lógica del texto adjunto: hechos acreditados, prueba invocada, norma aplicada y decisión. Señalá cada punto donde la conclusión no se sigue de lo anterior o donde falta un eslabón. Citá textualmente el fragmento en cada caso. No propongas redacción alternativa todavía.", why: "El salto lógico es el defecto que más cuesta ver en el propio texto." },
  { id: "p44", level: "trabajo", domain: "Escritos y proyectos", title: "Consistencia interna", objective: "Encontrar contradicciones dentro de un mismo documento.", prompt: "Revisá el documento adjunto buscando inconsistencias internas: fechas que no coinciden entre sí, montos distintos para el mismo concepto, nombres o roles cambiados, referencias cruzadas que no existen, y afirmaciones que se contradicen. Citá los dos fragmentos en conflicto en cada caso.", why: "Citar los dos fragmentos permite resolver sin volver a leer todo." },
  { id: "p45", level: "trabajo", domain: "Escritos y proyectos", title: "Antecedentes en orden", objective: "Redactar el relato de antecedentes de una resolución.", prompt: "A partir del material adjunto, redactá la sección de antecedentes: qué se pretende, qué se opuso, qué prueba se produjo y en qué estado llega el expediente. Tono impersonal y objetivo. Sin valoración. Todo lo que no surja del material va como [verificar].", why: "El pedido explícito de no valorar mantiene los antecedentes como antecedentes." },
  { id: "p46", level: "trabajo", domain: "Escritos y proyectos", title: "Contraargumentos anticipados", objective: "Poner a prueba una fundamentación antes de firmarla.", prompt: "Leé esta fundamentación y hacé de contraparte. Escribí los tres agravios más sólidos que podrían plantearse contra ella, con el fundamento de cada uno. No me digas si son procedentes: solo formulalos con la mayor fuerza posible.", why: "Anticipar el agravio más fuerte es más útil que confirmar que el texto está bien." },
  { id: "p47", level: "trabajo", domain: "Notificaciones y oficios", title: "Oficio a partir de una manda", objective: "Redactar una comunicación formal completa.", prompt: "Redactá un oficio dirigido a [organismo] solicitando [objeto], a partir de lo dispuesto en el material adjunto. Estructura: identificación del expediente, fundamento de la solicitud, objeto preciso de lo requerido, plazo si corresponde y datos de contacto. Todo dato que no surja del material va entre [[corchetes]] para que lo complete yo.", why: "Los corchetes dobles convierten el borrador en un formulario a completar." },
  { id: "p48", level: "trabajo", domain: "Notificaciones y oficios", title: "Control de una cédula", objective: "Verificar que una notificación esté completa.", prompt: "Revisá esta cédula contra una lista de control que quiero que armes primero: destinatario y domicilio, carácter del domicilio, expediente, qué se notifica, transcripción o adjunto, plazo que corre, firma y fecha. Devolvé la lista con cumple sí/no y qué falta.", why: "Pedir que arme la lista primero deja la lista disponible para las próximas." },
  { id: "p49", level: "trabajo", domain: "Plazos y control", title: "Extraer plazos de un texto", objective: "No perder un vencimiento escondido en el documento.", prompt: "Del documento adjunto extraé todo lo que implique un plazo: días, fechas límite, términos que empiezan a correr y condiciones que los suspenden o interrumpen. Tabla: plazo, desde qué hecho corre, cuántos días, si es hábil o corrido según el texto, y dónde consta. Si el texto no lo aclara, escribí «no aclarado».", why: "«No aclarado» señala exactamente dónde hay que ir a mirar la norma." },
  { id: "p50", level: "trabajo", domain: "Plazos y control", title: "Checklist de un tipo de trámite", objective: "Estandarizar el control de una categoría de expedientes.", prompt: "Armá una lista de control para revisar [tipo de trámite] antes de despacharlo. Cada punto debe ser verificable con sí o no. Agrupá por bloques: presupuestos formales, notificaciones, prueba, plazos y contenido. Ordená dentro de cada bloque por consecuencia de la omisión.", why: "Estandarizar el control es lo que permite delegarlo sin perder calidad." },
  { id: "p51", level: "trabajo", domain: "Audiencias", title: "Preguntas desde el material", objective: "Preparar una intervención a partir de fuentes.", prompt: "A partir de los documentos adjuntos, elaborá un listado de preguntas para [tipo de audiencia o entrevista]. Agrupalas por tema. Para cada pregunta indicá qué fragmento del material la origina y qué información busca obtener. Marcá aparte las preguntas cuya respuesta ya consta en el material.", why: "El último grupo evita preguntar lo que ya está contestado." },
  { id: "p52", level: "trabajo", domain: "Audiencias", title: "Del audio a la lista de temas", objective: "Convertir una grabación en material accionable.", prompt: "A partir de la transcripción adjunta, devolvé: temas tratados en orden de aparición, decisiones tomadas con su responsable si se mencionó, tareas pendientes con plazo si se indicó, y cuestiones que quedaron abiertas sin resolución. No infieras responsables ni plazos que no se hayan dicho explícitamente.", why: "La prohibición de inferir es lo que hace confiable la minuta." },
  { id: "p53", level: "trabajo", domain: "Audiencias", title: "Localizar un pasaje en la transcripción", objective: "Encontrar dónde se dijo algo puntual.", prompt: "En la transcripción adjunta, encontrá todos los pasajes donde se habla de [tema]. Para cada uno: cita textual, quién lo dice si figura, y marca de tiempo si la transcripción la tiene. No resumas ni interpretes: solo localizá y citá.", why: "Localizar sin interpretar es la tarea donde la transcripción es más confiable." },
  { id: "p54", level: "trabajo", domain: "Sesgo", title: "Análisis sin pista de respuesta", objective: "Obtener un contraste honesto sobre una cuestión.", prompt: "Sobre la cuestión planteada en el material adjunto, presentá los argumentos a favor y en contra de cada una de las posiciones posibles, con igual extensión y sin indicar cuál considerás más sólida. Al final listá qué información adicional inclinaría la balanza en cada sentido.", why: "La simetría forzada es la mejor defensa contra la complacencia." },
  { id: "p55", level: "trabajo", domain: "Sesgo", title: "Rúbrica antes de la crítica", objective: "Pedir evaluación objetiva de un texto propio.", prompt: "Vas a evaluar el texto adjunto con esta rúbrica: [criterio 1, 25 puntos], [criterio 2, 25], [criterio 3, 25], [criterio 4, 25]. Cada criterio se cumple o no se cumple, sin puntajes intermedios. Evaluá categoría por categoría, justificá con cita textual, y sumá el total recién al final. Después listá tres cambios concretos que más subirían el puntaje.", why: "Evaluar primero y sumar después evita que justifique una conclusión previa." },
  { id: "p56", level: "trabajo", domain: "Sesgo", title: "Revisar mi propio pedido", objective: "Detectar el sesgo antes de enviarlo.", prompt: "Antes de responder, analizá el pedido que te voy a hacer y decime si contiene alguna pista sobre la respuesta que espero: adjetivos valorativos, presuposiciones, formulaciones retóricas o restricciones que apuntan a un solo lado. Reformulalo de manera neutral. Recién después respondelo en su versión neutral.", why: "El propio modelo detecta el sesgo del prompt si se lo pedís antes de responder." },
  { id: "p57", level: "trabajo", domain: "Sesgo", title: "Abogado del diablo", objective: "Someter una conclusión propia a presión.", prompt: "Vas a intentar refutar la siguiente conclusión, no confirmarla: [conclusión]. Buscá el argumento más fuerte en contra, el supuesto implícito más débil y el escenario donde la conclusión falla. Si después de eso seguís considerándola sostenible, decilo, pero primero agotá la refutación.", why: "Pedir refutación explícita neutraliza la tendencia a coincidir." },
  { id: "p58", level: "trabajo", domain: "Escritura", title: "Tres esquemas, no un texto", objective: "Iniciar la redacción por donde rinde.", prompt: "Necesito redactar [tipo de documento] sobre [tema], con este material de base. No redactes todavía. Dame tres opciones de esquema con enfoques distintos, cada una con sus títulos de sección y una línea explicando qué prioriza. Después de que elija, expandimos a viñetas.", why: "Corregir un esquema reescribe secciones enteras; corregir el texto, palabras." },
  { id: "p59", level: "trabajo", domain: "Escritura", title: "Detección de relleno", objective: "Depurar un borrador de frases vacías.", prompt: "Revisá el borrador adjunto y señalá cada oración que no aporte información verificable: fórmulas tautológicas, principios generales enunciados sin aplicarse al caso, adjetivación sin respaldo y construcciones del tipo «no se trata de X sino de Y» con términos vagos. Citá cada una y proponé si se elimina o se reemplaza por contenido concreto.", why: "El relleno se detecta mejor por patrones que por lectura general." },
  { id: "p60", level: "trabajo", domain: "Escritura", title: "Recortar sin perder contenido", objective: "Ajustar un texto que quedó largo.", prompt: "Este texto tiene [n] palabras y necesito que tenga [m]. Recortá eliminando primero redundancias, después subordinadas innecesarias, y solo al final contenido. Marcá con [recortado: qué] cada vez que elimines información sustancial, para que yo decida si vuelve.", why: "La marca de lo recortado convierte una poda a ciegas en una decisión informada." },
  { id: "p61", level: "trabajo", domain: "Lenguaje claro", title: "Revisión con reglas explícitas", objective: "Aplicar criterios institucionales de redacción.", prompt: "Actuá como corrector de estilo institucional. Revisá el texto adjunto según estos criterios: oraciones de menos de 30 palabras, voz activa, un concepto por párrafo, sin gerundios de posterioridad, sin latinismos innecesarios, con desarrollo de siglas en su primera aparición. Devolvé una tabla: fragmento original, criterio incumplido, propuesta de reemplazo. No cambies el sentido.", why: "El formato de tabla permite aceptar o rechazar cada cambio por separado." },
  { id: "p62", level: "trabajo", domain: "Lenguaje claro", title: "Medir la legibilidad", objective: "Saber qué tan difícil es un texto propio.", prompt: "Analizá este texto y devolvé: extensión promedio de oración, oración más larga citada textualmente, cantidad de subordinadas por párrafo, densidad de términos técnicos y proporción de voz pasiva. Después señalá los tres párrafos más difíciles de leer y por qué.", why: "Los tres párrafos más difíciles concentran casi toda la mejora posible." },
  { id: "p63", level: "trabajo", domain: "Perspectiva de género", title: "Revisión con enfoque diferencial", objective: "Detectar sesgos y estereotipos en un texto.", prompt: "Revisá el texto adjunto e identificá: uso de estereotipos de género, lenguaje que invisibiliza, valoración diferencial de conductas según el género de quien las realiza, y omisión de circunstancias de vulnerabilidad relevantes para el caso. Citá cada hallazgo y proponé una redacción alternativa que conserve el contenido jurídico.", why: "Pedir la cita textual evita observaciones genéricas no accionables." },
  { id: "p64", level: "trabajo", domain: "Perspectiva de género", title: "Antecedentes no pertinentes", objective: "Depurar el relato de datos que no hacen al caso.", prompt: "En el texto adjunto, señalá toda mención a antecedentes personales, historia de vida, apariencia, vínculos afectivos o conducta previa que no sea pertinente al objeto del proceso. Para cada una: cita textual, por qué no es pertinente, y si su supresión afecta algo del razonamiento.", why: "La última pregunta distingue lo prescindible de lo que hay que fundamentar mejor." },
  { id: "p65", level: "trabajo", domain: "Verificación", title: "Auditar una respuesta de IA", objective: "Revisar críticamente un texto generado.", prompt: "Te voy a pegar una respuesta producida por otro asistente. Identificá: afirmaciones verificables, afirmaciones que suenan verificables pero no lo son, datos concretos que requieren comprobación en fuente oficial, y afirmaciones sin respaldo posible. No corrijas el texto: solo clasificá y listá qué habría que comprobar y dónde.", why: "Entrena la lectura crítica que el circuito de verificación necesita." },
  { id: "p66", level: "trabajo", domain: "Verificación", title: "Borrador con campos de control", objective: "Producir un borrador que exija verificación antes de usarse.", prompt: "Redactá un borrador de [tipo de documento] con el material adjunto. Toda mención a norma, fecha, monto, plazo o cita debe quedar entre [[dobles corchetes]] para que yo la verifique. Al final del documento incluí una tabla con cada elemento marcado, dónde debería verificarse y qué pasa si es incorrecto. No entregues el borrador sin esa tabla.", why: "El borrador llega con su propio plan de verificación incorporado." },
  { id: "p67", level: "trabajo", domain: "Verificación", title: "Segunda lectura con otro rol", objective: "Revisar el mismo texto desde otra perspectiva.", prompt: "Ya revisamos este texto como corrector de estilo. Ahora leelo de nuevo con un rol distinto: alguien que tiene que cumplir lo que el texto ordena y no conoce el expediente. Señalá todo lo que resulte ambiguo, imposible de cumplir o que requiera información que el texto no da.", why: "Cambiar el rol produce hallazgos que la relectura con el mismo rol no da." },
  { id: "p68", level: "trabajo", domain: "Búsqueda", title: "Ampliar una búsqueda que no da resultados", objective: "Destrabar una consulta infructuosa.", prompt: "Busqué [consulta] en [portal] y no encontré nada útil. Sin darme resultados, decime: qué otros términos podría estar usando la fuente, qué sinónimos o denominaciones alternativas existen, si el tema puede estar tratado bajo otra figura, y qué otras fuentes oficiales podrían tenerlo.", why: "Cuando la búsqueda falla, casi siempre el problema es el vocabulario o la fuente." },
  { id: "p69", level: "trabajo", domain: "Datos", title: "Detectar anomalías en una planilla", objective: "Encontrar errores de carga sin revisar fila por fila.", prompt: "Te paso datos de una planilla. Sin corregir nada, señalá: valores fuera de rango esperable, fechas imposibles o inconsistentes, duplicados probables, celdas vacías en campos que parecen obligatorios y formatos mezclados en una misma columna. Devolvé fila y columna de cada hallazgo.", why: "Señalar sin corregir mantiene el control del dato en quien lo cargó." },
  { id: "p70", level: "trabajo", domain: "Datos", title: "Indicadores de una oficina", objective: "Definir qué medir antes de medirlo.", prompt: "Quiero medir el funcionamiento de [tipo de oficina]. Antes de proponer indicadores, hacéme cinco preguntas sobre qué decisiones quiero tomar con esa información. Después proponé cinco indicadores, cada uno con: qué mide, cómo se calcula, con qué dato disponible, y qué comportamiento indeseado podría inducir.", why: "El último punto es el que evita que el indicador deforme el trabajo que mide." },
  { id: "p71", level: "trabajo", domain: "Gestión", title: "Instructivo para quien no estuvo", objective: "Transferir un procedimiento a un colega.", prompt: "A partir de la conversación anterior, escribí un instructivo de una carilla para que otra persona del equipo pueda repetir este procedimiento sin haber participado. Formato de pasos numerados, con la instrucción exacta a usar en cada paso entre comillas, qué debe verificar antes de avanzar y cuáles son los tres errores más probables.", why: "Convierte un hallazgo individual en procedimiento de la oficina." },
  { id: "p72", level: "trabajo", domain: "Gestión", title: "Circuito de un trámite dibujado", objective: "Ver un procedimiento completo de un vistazo.", prompt: "A partir de esta descripción, dibujá el circuito del trámite en formato de texto: cada etapa, quién interviene, qué documento entra y sale, qué decisión se toma y a dónde deriva según el resultado. Marcá los puntos donde el trámite puede quedar detenido y por qué.", why: "Los puntos de detención son donde se concentra la demora real." },
  { id: "p73", level: "trabajo", domain: "Capacitación", title: "Caso práctico para el equipo", objective: "Armar un ejercicio de entrenamiento.", prompt: "Armá un caso práctico ficticio para entrenar a mi equipo en [tema]. Debe incluir: la situación planteada con datos completos pero inventados, tres preguntas de resolución, la respuesta esperada de cada una, y dos errores que probablemente cometan con su explicación. Nada de datos reales.", why: "Los errores previstos con su explicación son la parte que enseña." },
  { id: "p74", level: "trabajo", domain: "Atención al público", title: "Guion para una situación difícil", objective: "Prepararse para una atención tensa.", prompt: "Tengo que atender a una persona que [describir la situación]. Armame: cómo abrir la conversación, tres frases para reencauzar si sube el tono, qué puedo y qué no puedo decir en esta situación, y cómo cerrar dejando claro el próximo paso. Sin frases hechas ni tono condescendiente.", why: "Tener las frases pensadas antes evita improvisar en el peor momento." },
  { id: "p75", level: "trabajo", domain: "Trabajo con normativa", title: "Requisitos de un artículo, desmenuzados", objective: "Convertir una norma en una lista operativa.", prompt: "Te pego el texto de [artículo]. Convertilo en una lista de requisitos verificables, uno por línea, en el orden en que deben controlarse. Separá los que son requisitos de admisibilidad de los que son de fondo. Donde el texto use un término técnico, dejalo tal cual y no lo interpretes.", why: "La lista operativa se reutiliza en todos los expedientes de esa clase." },
  { id: "p76", level: "trabajo", domain: "Trabajo con normativa", title: "Comparar dos regímenes", objective: "Ubicar diferencias entre normas parecidas.", prompt: "Compará los textos de [norma A] y [norma B] que te adjunto. Tabla: aspecto, qué dice A con cita, qué dice B con cita, en qué se diferencian. No opines sobre cuál se aplica: solo compará los textos que te di.", why: "Prohibir la conclusión sobre aplicabilidad mantiene la decisión del lado humano." },
  { id: "p77", level: "trabajo", domain: "Agentes", title: "Plan antes de ejecutar", objective: "Trabajar con seguridad en una aplicación con permisos.", prompt: "Antes de ejecutar cualquier acción, proponé un plan detallado paso a paso indicando qué archivo tocás y qué le hacés. No elimines, no envíes y no publiques nada. Si detectás algo que requiere una de esas acciones, listalo aparte para que lo decida yo. Esperá mi autorización explícita antes de empezar.", why: "El plan previo hace visible lo que el pedido no incluía." },
  { id: "p78", level: "trabajo", domain: "Agentes", title: "Ordenar una carpeta de trabajo", objective: "Poner en orden documentación propia.", prompt: "Explorá esta carpeta sin modificar nada y devolveme: qué hay, cómo está nombrado, qué duplicados detectás y qué criterio de organización propondrías. Después esperá que yo apruebe el criterio. Recién ahí renombrá y movés, sin eliminar nada.", why: "Explorar, proponer, aprobar, ejecutar: en ese orden y sin borrar." },
  { id: "p79", level: "trabajo", domain: "Privacidad", title: "Sustitución inversa controlada", objective: "Devolver los datos reales al texto trabajado.", prompt: "Te paso un texto con etiquetas entre corchetes y el glosario de reemplazos. Devolvé el texto con los datos reales restituidos. Después listá cada sustitución realizada con su ubicación, y señalá si quedó alguna etiqueta sin reemplazar o algún dato reemplazado que no figuraba en el glosario.", why: "El control final detecta las etiquetas cruzadas, que es el error típico." },
  { id: "p80", level: "trabajo", domain: "Aprendizaje", title: "Explicame mi propio error", objective: "Aprender de una corrección recibida.", prompt: "Me devolvieron este trabajo con estas observaciones. Explicame qué principio o criterio hay detrás de cada observación, no solo qué corregir. Después decime qué tendría que revisar de ahora en más para no repetirlo, en forma de lista de control.", why: "El principio detrás de la corrección es lo que se transfiere al próximo trabajo." },

  // ── NIVEL 3 · CIRCUITOS COMPLETOS ───────────────────────────────
  { id: "p84", level: "metodo", domain: "Circuito completo", title: "Revisión en tres pasadas", objective: "Controlar un documento con criterios distintos cada vez.", prompt: "Vas a revisar este documento tres veces, con un foco distinto cada vez y sin mezclarlos. Primera pasada: solo estructura y requisitos formales. Segunda: solo coherencia lógica entre hechos, prueba y decisión. Tercera: solo lenguaje y claridad. Entregá las tres devoluciones por separado.", why: "Separar las pasadas evita que un hallazgo grande tape a los chicos." },
  { id: "p85", level: "metodo", domain: "Trabajo en equipo", title: "Protocolo de oficina", objective: "Acordar reglas de uso en un equipo.", prompt: "Ayudame a redactar un protocolo interno de uso de IA generativa para una oficina judicial de [cantidad] personas. Debe cubrir: qué tareas se pueden delegar, qué se verifica siempre y contra qué fuente, qué nunca se carga en herramientas públicas, cómo se anonimiza, cómo se deja registro y quién revisa qué. Formato de una carilla, en oraciones que se puedan cumplir sin interpretación.", why: "Un protocolo que necesita interpretación no se cumple." },
  { id: "p86", level: "metodo", domain: "Trabajo en equipo", title: "Reglas de un espacio compartido", objective: "Ordenar un repositorio de trabajo colaborativo.", prompt: "Ayudame a definir las reglas de un espacio de trabajo compartido con documentos de [tipo]. Cubrí: criterio de nomenclatura de archivos con fecha y origen, qué se puede cargar y qué no, quién puede agregar fuentes, cómo se marca lo verificado frente a lo pendiente, y qué se hace con lo que deja de estar vigente. Una regla por línea, sin excepciones ambiguas.", why: "La nomenclatura y el estado de verificación son el 80 % del orden." },
  { id: "p87", level: "metodo", domain: "Trabajo en equipo", title: "Repartir una tarea grande", objective: "Distribuir trabajo sin superposiciones ni huecos.", prompt: "Tengo que repartir [tarea] entre [n] personas. Proponé tres formas distintas de dividirla: por etapa, por tipo de material y por criterio. Para cada una decí qué se gana, qué se pierde, dónde puede haber superposición y dónde puede quedar un hueco sin responsable.", why: "El hueco sin responsable es el que aparece cuando ya es tarde." },
  { id: "p88", level: "metodo", domain: "Trabajo con normativa", title: "Mapa de una cuestión", objective: "Organizar el material normativo de un tema.", prompt: "Con las fuentes oficiales que cargué, armá un mapa de la cuestión: norma aplicable con su artículo, precedentes que la interpretan con cita, doctrina si figura en las fuentes, y puntos donde las fuentes se contradicen entre sí. Todo con cita textual. Al final, listá las preguntas que las fuentes cargadas no permiten responder.", why: "La lista final define qué falta buscar y evita cerrar en falso." },
  { id: "p89", level: "metodo", domain: "Trabajo con normativa", title: "Ficha de un instituto", objective: "Construir material de consulta reutilizable.", prompt: "Con las fuentes que cargué, armá una ficha de consulta sobre [instituto]: definición según las fuentes, requisitos, plazos, efectos, excepciones y remisiones a otras normas. Todo con cita. Dejá una sección final de «cuestiones abiertas» con lo que las fuentes no resuelven.", why: "Una ficha con cuestiones abiertas se puede actualizar; una cerrada envejece mal." },
  { id: "p90", level: "metodo", domain: "Capacitación", title: "Plan de aprendizaje en cuatro semanas", objective: "Incorporar la herramienta de forma sostenida.", prompt: "Armá un plan de cuatro semanas para incorporar IA generativa a mi trabajo en [función]. Una tarea nueva por semana, de menor a mayor riesgo, con el criterio de verificación correspondiente a cada una. Incluí para cada semana un indicador simple de si conviene avanzar o repetir. Nada de automatización en las dos primeras semanas.", why: "La progresión por riesgo es lo que hace que el hábito se sostenga." },
  { id: "p91", level: "metodo", domain: "Capacitación", title: "Diagnóstico de necesidades del equipo", objective: "Saber qué capacitación hace falta antes de darla.", prompt: "Ayudame a diseñar un relevamiento breve para saber qué necesita mi equipo en materia de IA generativa. Diez preguntas como máximo, que se respondan en cinco minutos, que no expongan a nadie y que distingan entre lo que la gente usa, lo que cree que puede usar y lo que le preocupa. Después decime cómo interpretar cada respuesta.", why: "Preguntar por lo que preocupa da mejor información que preguntar por lo que se sabe." },
  { id: "p92", level: "metodo", domain: "Verificación", title: "Auditoría de un procedimiento propio", objective: "Revisar cómo se está usando la herramienta.", prompt: "Te describo cómo venimos usando IA en la oficina para [tarea]. Auditá ese procedimiento: dónde falta verificación, dónde se está cargando información que no debería, dónde no queda registro, y qué pasaría si alguien cuestionara un resultado. Ordená los hallazgos por gravedad y proponé el ajuste mínimo para cada uno.", why: "El ajuste mínimo es el que se implementa; el rediseño completo queda en la carpeta." },
  { id: "p93", level: "metodo", domain: "Verificación", title: "Reconstruir cómo se llegó a un resultado", objective: "Dejar trazabilidad de un trabajo asistido.", prompt: "A partir de esta conversación, redactá un registro de trazabilidad: qué se pidió, con qué material, qué produjo la herramienta, qué se verificó y contra qué fuente, qué se corrigió y qué quedó pendiente. Formato de media carilla, para archivar junto al documento final.", why: "El registro se escribe en dos minutos ahora y vale por meses después." },
  { id: "p95", level: "metodo", domain: "Circuito completo", title: "Diseñar tu propia ficha de prompt", objective: "Producir una instrucción reutilizable de calidad institucional.", prompt: "Ayudame a convertir esta tarea que hago seguido en una ficha de prompt reutilizable. La ficha debe tener: rol, contexto, normativa o criterios de referencia, tarea, instrucciones paso a paso, restricciones explícitas y formato de salida. Hacéme las preguntas que necesites para completarla, de a una por vez, antes de escribirla.", why: "Preguntar de a una por vez es lo que hace que la ficha salga completa." }
];

## Tarea y contexto

Actúa como herramienta de apoyo para el **control técnico de decisiones judiciales con perspectiva de género**. Tu función es de análisis y asistencia: no reemplazas la actividad jurisdiccional, no fallas el caso ni emites una calificación sobre la persona juzgadora. Asistes a magistradas, magistrados y equipos técnicos revisando, entre pares, si el razonamiento incorporó la perspectiva de género de manera real y no meramente declarativa.

Tu análisis se organiza en tres capas, en este orden de prioridad:

1. **El MÉTODO de razonamiento (obligatorio).** Es el núcleo del análisis y se aplica siempre, en todas las materias. Está descripto en la sección «Método de razonamiento».

Regla rectora que ordena las tres capas: **el método es lo que siempre debés ejecutar; los precedentes son un recurso que usás solo cuando aportan, nunca un casillero que debas llenar.**

## Método de razonamiento (capa obligatoria)

Aplicá este método a todo caso, con independencia de la materia. Está construido sobre la guía metodológica para juzgar con perspectiva de género (su estructura de obligaciones previas y obligaciones al resolver el fondo). No es un checklist de respuestas sí/no: cada punto es una línea de razonamiento que debés desarrollar con relación a los hechos concretos del caso.

### A. Obligaciones previas: detectar el terreno

**A.1. Identificar asimetrías de poder, desigualdad estructural o contextos de violencia por razones de género.**
Preguntá: ¿existe entre las partes (o entre la parte y una institución) una relación asimétrica de poder relevante para el caso? ¿El conflicto se inscribe en un contexto de violencia, subordinación o discriminación estructural? La asimetría puede ser explícita (violencia física) o sutil (dependencia económica, relación de autoridad, vínculo de confianza, situación de cuidado). No la presumas: fundála en datos del expediente.

**A.2. Distinguir contexto objetivo y contexto subjetivo.**
- *Contexto objetivo:* los datos del entorno que enmarcan el caso (patrones de violencia en la región o el ámbito, antecedentes de la relación, estadísticas o marcos institucionales pertinentes, historia previa entre las partes).
- *Contexto subjetivo:* la situación particular de las personas involucradas (su posición de vulnerabilidad o poder, sus condiciones personales, cómo el conflicto las afecta de modo diferenciado).
Verificá si el tribunal analizó ambos o si se quedó en una lectura aislada y descontextualizada del hecho.

**A.3. Evaluar el deber de prueba de oficio.**
Cuando el material probatorio resulta insuficiente para visibilizar una posible situación de violencia, vulnerabilidad o discriminación, el órgano tiene el deber de ordenar prueba de oficio para esclarecerla. Verificá si, ante indicios y prueba incompleta, el tribunal usó esa facultad o si resolvió en contra de la parte vulnerable apoyándose en la mera insuficiencia probatoria.

### B. Obligaciones al resolver el fondo: controlar el razonamiento

**B.1. Detectar estereotipos y prejuicios de género en la valoración de los hechos y la prueba.**
Este es el control más fino y más importante. Un estereotipo contamina la valoración probatoria de cuatro maneras típicas; buscá específicamente cuál o cuáles aparecen:
- **(i) Sobrevaloración estereotípica:** se da relevancia a un hecho o prueba que no la tiene, sobre la base de una idea preconcebida de género (p. ej., la vestimenta, la vida sexual o las salidas de la víctima).
- **(ii) Devaluación estereotípica:** se resta valor a una prueba a partir de una idea preconcebida (p. ej., descreer del testimonio de la víctima por su estado emocional o por imprecisiones atribuibles al trauma).
- **(iii) Sesgo de confirmación:** se toman en cuenta solo las pruebas que confirman el estereotipo y se ignoran las que lo contradicen.
- **(iv) Relevancia espuria:** a partir del estereotipo, se introduce y pondera un hecho intrascendente para la resolución (p. ej., el estado civil de la madre en una disputa de cuidado personal).

**B.2. Controlar el estándar probatorio aplicado.**
¿Se exigió a la víctima una prueba imposible o irrazonable (resistencia física, marcas, corroboración documental de un hecho clandestino)? ¿Se centró el análisis en el consentimiento o en elementos ajenos a él? ¿Se valoró el testimonio único conforme a su naturaleza?

**B.3. Aplicar enfoque interseccional cuando corresponda.**
Si en la persona confluyen el género con otros factores (edad, discapacidad, identidad u orientación sexual, etnia, pobreza, situación migratoria, estado de salud, situación procesal), verificá si el tribunal advirtió que esos factores no se suman sino que se *entrecruzan*, generando una forma de discriminación cualitativamente distinta y agravada. La omisión de este enfoque, cuando los factores estaban presentes, es un déficit.

**B.4. Evaluar la motivación y la respuesta judicial.**
¿La perspectiva de género está incorporada en el razonamiento o solo mencionada en citas ornamentales? ¿La solución protege de manera efectiva los derechos comprometidos? ¿Prevé, cuando corresponde, medidas de reparación, no repetición o protección reforzada? ¿Evita la revictimización en el trámite (declaraciones repetidas innecesarias, exámenes intrusivos, exposición pública)?

## Repertorio jurisprudencial (capa de apoyo, NO obligatoria)

Lo que sigue es un **repertorio ilustrativo y no exhaustivo** de estándares de la Corte Interamericana de Derechos Humanos. Su rol es darte vocabulario y anclaje para fundar observaciones **cuando exista una analogía genuina** con el caso analizado.

**Cómo usar este repertorio (reglas de uso flexible):**
- Usá los estándares que tengan analogía **real** con los hechos. Pueden ser **cero, uno o varios**.
- Si **varios** estándares concurren (algo frecuente: un mismo hecho suele activar líneas jurisprudenciales combinadas, como consentimiento + valoración del testimonio + interseccionalidad), **articulá cómo se combinan**, no los enumeres sueltos.
- **FALLBACK — instrucción central:** si **ningún** caso del repertorio encuadra con limpieza, **NO fuerces una analogía**. Decilo expresamente y razoná desde el **principio general** del método (sección anterior). Una fórmula válida es: *«Ningún precedente del repertorio guarda analogía fáctica suficiente con este caso; la observación se funda en el estándar de [contexto / no estereotipación / debida diligencia / interseccionalidad], que se razona del siguiente modo…»*. Forzar un precedente que no aplica es un error más grave que no citar ninguno.
- El repertorio está centrado en violencia y delitos sexuales porque es donde la Corte IDH desarrolló más doctrina; para materias civiles, de familia o laborales con menor desarrollo jurisprudencial, **es esperable y correcto** apoyarse más en el método (capa obligatoria) que en los precedentes.

### Repertorio

**1. Contexto y deber de prevención — *Campo Algodonero* Vs. México (2009); *Velásquez Paiz* Vs. Guatemala (2015).**
Ante indicios de desaparición de mujeres, el Estado debe actuar de inmediato y de oficio. Los hechos no se analizan aislados sino en su contexto de discriminación estructural. Las reparaciones deben ser transformadoras, no meramente restitutivas. *Velásquez Paiz* refuerza que el deber de debida diligencia se intensifica frente a un contexto conocido de violencia contra las mujeres y rechaza desviar la atención hacia la conducta de la víctima.

**2. Estereotipo de «mala víctima» y descrédito — *Véliz Franco* Vs. Guatemala (2014); *Barbosa de Souza* Vs. Brasil (2021).**
Constituye violación al deber de no discriminación y debida diligencia centrar la investigación o el fallo en la conducta moral, el estilo de vida, las relaciones de pareja o la vestimenta de la víctima. Estos estereotipos trasladan la culpa a la víctima y fomentan la impunidad.

**3. Roles tradicionales, familia y orientación sexual — *Atala Riffo y niñas* Vs. Chile (2012); *Fornerón e hija* Vs. Argentina (2012).**
Es discriminatorio fundar decisiones de cuidado personal, custodia o filiación en concepciones tradicionales de los roles de género (la «madre abnegada», el padre como mero proveedor) o en el estado civil u orientación sexual de una de las partes.

**4. Consentimiento como eje en delitos sexuales — *Angulo Losada* Vs. Bolivia (2022).**
El elemento central del tipo penal en agresiones sexuales debe ser la **ausencia de consentimiento**. No es exigible que la víctima haya opuesto resistencia física ni que presente marcas para validar la denuncia.

**5. Valoración del testimonio en la clandestinidad — *Rosendo Cantú* Vs. México (2010); *Fernández Ortega* Vs. México (2010); *J.* Vs. Perú (2013).**
Como los delitos sexuales ocurren sin testigos, el testimonio de la víctima es prueba fundamental. Las imprecisiones derivadas del trauma no anulan su credibilidad, y la falta de prueba forense inmediata no devalúa la acusación.

**6. Consentimiento informado y paternalismo en salud — *I.V.* Vs. Bolivia (2016).**
El consentimiento informado en salud debe ser previo, libre, pleno e informado. No se infiere del silencio, no se obtiene válidamente en entornos de dolor o estrés (como el parto) ni puede ser suplantado por la autorización del cónyuge, pareja o terceros.

**7. Violencia obstétrica y secreto profesional — *Manuela y otros* Vs. El Salvador (2021); *Brítez Arce* Vs. Argentina (2022).**
La violencia obstétrica es una violación de derechos humanos. Ante emergencias obstétricas, el secreto profesional médico y la vida de la paciente prevalecen sobre el deber de denunciar. Se prohíbe juzgar sobre la base de prejuicios acerca de la maternidad.

**8. Interseccionalidad — *Gonzáles Lluy* Vs. Ecuador (2015); *Guzmán Albarracín* Vs. Ecuador (2020); *Vicky Hernández* Vs. Honduras (2021).**
Cuando confluyen género, edad, identidad de género, salud (p. ej. VIH), etnia o pobreza, los factores se **entrecruzan** y generan una discriminación agravada y cualitativamente distinta (*Gonzáles Lluy* introdujo expresamente este enfoque). La asimetría se agrava ante relaciones de confianza o autoridad, como la docente-alumna (*Guzmán Albarracín*).

**9. Discriminación estructural e interseccional en contexto laboral/socioeconómico — *Empleados de la Fábrica de Fuegos de Santo Antônio de Jesus* Vs. Brasil (2020).**
La confluencia de género, pobreza, raza y edad en un contexto de explotación laboral configura discriminación estructural e interseccional. Útil como ancla en materias laborales o socioeconómicas donde la vulnerabilidad de género se cruza con la precariedad.

**10. Violencia institucional y revictimización — *V.R.P., V.P.C.* Vs. Nicaragua (2018); *Mujeres Víctimas de Tortura Sexual en Atenco* Vs. México (2018); *Bedoya Lima* Vs. Colombia (2021).**
Someter a la víctima a declaraciones repetitivas, exámenes intrusivos o al descrédito público constituye violencia institucional y revictimización, equiparable a trato cruel, inhumano o degradante. *V.R.P.* exige debida diligencia reforzada y doble protección (género + minoría de edad) cuando la víctima es una niña, niño o adolescente.

**11. Devaluación por situación procesal — *Espinoza Gonzáles* Vs. Perú (2014).**
La condición de sospechosa, procesada o condenada, o la gravedad del delito imputado, no justifican en ningún caso la inacción estatal ante denuncias de violencia de género, tortura o violencia sexual.

**12. Separación familiar y prejuicios sobre la familia «idónea» — *Ramírez Escobar* Vs. Guatemala (2018).**
Es discriminatorio separar a un niño de su familia (incluida la vía de adopción) sobre la base de prejuicios acerca de la situación económica, el modelo de familia o la condición de la madre. Útil en materia de familia y niñez fuera del campo penal.

**13. Identidad de género y reconocimiento — Opinión Consultiva OC-24/17.**
Los Estados deben garantizar el reconocimiento de la identidad de género autopercibida y la igualdad sin discriminación por orientación sexual o identidad de género. Útil como ancla de estándar (no es un caso contencioso) en cuestiones civiles y registrales.

## Reglas de generación (capa transversal)

**Anti-alucinación (crítico en lo jurídico):**
- Citá **únicamente** los casos y estándares incluidos en el repertorio de este prompt. **No introduzcas otros casos, no inventes números de párrafo ni cites jurisprudencia de memoria.**
- Formulá toda analogía **a nivel del principio o estándar**, nunca atribuyendo al caso de referencia detalles fácticos que no figuran en su descripción del repertorio.
- No inventes hechos, pruebas, normas ni circunstancias que no consten en el material analizado.

**Distinción de planos (recuperado del enfoque base):**
Distinguí siempre y de manera explícita entre: (a) hechos del caso, (b) argumentos de las partes, (c) fundamentos del órgano judicial, y (d) tus observaciones críticas. No mezcles estos planos.

**Rigor en el diagnóstico:**
- **No** afirmes que hay perspectiva de género solo porque la resolución mencione «igualdad», «violencia» o «derechos humanos». Verificá si hay incorporación concreta en el razonamiento.
- Si **no hay información suficiente** para una conclusión firme, decilo expresamente; no completes con suposiciones.
- Si el caso **no presenta elementos relevantes de género**, indicalo de manera fundada y explicá por qué. No fuerces un análisis de género donde no lo hay.

**Tono:**
- Lenguaje jurídico, técnico, claro y descriptivo. Registro de asistencia técnica entre pares, no de auditoría ni de sanción.
- Evitá el tono militante, emocional, dogmático o ideológico. Toda crítica debe estar justificada en el caso y en los estándares aplicables, señalando en qué parte del razonamiento aparece el déficit y por qué es problemático.

## Descripción paso a paso del análisis

1. **Lectura íntegra** del material aportado.
2. **Identificación:** tipo de proceso, órgano, partes, hechos relevantes, pretensión, prueba y decisión adoptada o proyectada.
3. **Aplicación del método (capa obligatoria):** recorré las obligaciones previas (A.1–A.3) y las del fondo (B.1–B.4), desarrollándolas sobre los hechos concretos.
4. **Contraste con el repertorio (capa de apoyo):** identificá qué estándares guardan analogía genuina —cero, uno o varios— y articulalos. Si ninguno encuadra, aplicá el fallback.
5. **Detección de déficits y aciertos:** señalá dónde el razonamiento siguió o se apartó del estándar correcto.
6. **Calificación del grado de incorporación** de la perspectiva de género.
7. **Recomendaciones** concretas de ajuste.

---

## Formato de salida obligatorio

Estructurá la respuesta con estas secciones numeradas:

1. **Identificación del caso** — tipo de proceso, órgano judicial, partes, objeto del litigio, decisión analizada.
2. **Resumen breve del caso** — hechos principales, conflicto jurídico, decisión adoptada o proyectada.
3. **Indicadores de perspectiva de género en juego** — asimetrías de poder, contexto (objetivo y subjetivo), violencia o discriminación, estereotipos, factores interseccionales, barreras de acceso a justicia. Si no los hay, indicarlo de modo fundado.
4. **Control del razonamiento judicial (método)** — desarrollá, sobre los hechos del caso:
   - Análisis del contexto (objetivo y subjetivo) y de las asimetrías de poder (A.1–A.2).
   - Tratamiento de la prueba, incluido el deber de prueba de oficio si aplica (A.3, B.2).
   - Presencia o ausencia de estereotipos, identificando cuál de los cuatro modos de contaminación (B.1.i–iv) aparece, si alguno.
   - Enfoque interseccional cuando corresponda (B.3).
   - Calidad de la motivación y adecuación de la solución, incluida la evitación de revictimización (B.4).
5. **Anclaje jurisprudencial** — para cada observación relevante, indicá el estándar del repertorio que la sostiene **cuando exista analogía genuina**, explicando la analogía; o aplicá expresamente el fallback si ningún caso encuadra. Articulá los estándares que concurran.
6. **Hallazgos** — aciertos del órgano; omisiones o debilidades; riesgos jurídicos detectados.
7. **Conclusión: grado de incorporación de la perspectiva de género** — clasificá en: *Incorporación adecuada* / *Incorporación parcial* / *Incorporación insuficiente o ausente*. (Es una valoración técnica del razonamiento, no un juicio sobre la persona juzgadora.)
8. **Fundamentación de la conclusión** — uno o dos párrafos que sinteticen la valoración.
9. **Recomendaciones de ajuste** — acciones concretas de mejora, sustentadas en el método y, cuando aplique, en el repertorio.
10. **Versión breve ejecutiva** — resumen de 5 a 10 líneas para lectura rápida por magistradas, magistrados o equipos técnicos.`

      { n: 5, nombre: 'Revisión de lenguaje', entra: 'El texto verificado.', sale: 'Observaciones de estilo, una por una.', control: 'Aceptás o rechazás cada cambio: no se aplican en bloque.',
        prompt: 'Revisá el texto según estos criterios: oraciones de menos de 30 palabras, voz activa, un concepto por párrafo, sin latinismos innecesarios, siglas desarrolladas en su primera aparición. Devolvé una tabla: fragmento original, criterio incumplido, propuesta de reemplazo, y si la propuesta implica algún riesgo de pérdida de precisión. No cambies el sentido.' },
      { n: 6, nombre: 'Registro de trazabilidad', entra: 'Todo el proceso.', sale: 'Media carilla para archivar junto al documento.', control: 'Se escribe en dos minutos y vale por meses.',
        prompt: 'A partir de esta conversación, redactá un registro de trazabilidad: qué se pidió, con qué material, en qué etapas se trabajó, qué se verificó y contra qué fuente, qué se corrigió y qué quedó pendiente. Media carilla, para archivar junto al documento final.' }
    ]
  }
];

const CopyBtn = ({ text, label = 'Copiar', small = false }) => {
  const [done, setDone] = useState(false);
  const go = () => {
    if (!navigator.clipboard) return;
    navigator.clipboard.writeText(text).then(() => {
      setDone(true);
      setTimeout(() => setDone(false), 1600);
    }).catch(() => { });
  };
  return (
    <button onClick={go}
      className={`inline-flex items-center gap-2 rounded-lg font-medium transition-all ${small ? 'px-3 py-2 min-h-[2.5rem] text-xs' : 'px-4 py-2.5 min-h-[2.75rem] text-sm'} ${done ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-white hover:bg-slate-700'}`}>
      {done ? <Check className="w-4 h-4" /> : <Copy className="w-4 h-4" />}
      {done ? 'Copiado' : label}
    </button>
  );
};

const shuffle = (arr, seed = 7) => {
  const a = [...arr];
  let s = seed;
  const rnd = () => { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; };
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
