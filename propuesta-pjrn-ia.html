const promptItems = [
  { id: "p1", level: "inicio", domain: "Primeros pasos", title: "Explicación sin apuro", objective: "Aprender una función nueva sin sentirse expuesto.", prompt: "Actuá como instructor paciente. Necesito aprender a usar [herramienta o función] desde cero. Explicame en pasos cortos, sin jerga, con una sola acción por paso. Después de cada paso decime qué debería ver en pantalla y cuál es el error más frecuente en ese punto.", why: "Convierte una dificultad tecnológica en una secuencia practicable y sin vergüenza." },
  { id: "p2", level: "inicio", domain: "Papel a digital", title: "De apuntes a minuta", objective: "Aprovechar notas manuscritas de una reunión.", prompt: "Te voy a pasar el texto extraído de notas manuscritas. Actuá como asistente de organización documental. Convertilas en una minuta con secciones: tema, hechos mencionados, dudas abiertas, compromisos asumidos, próximos pasos y datos a verificar. No agregues nada que no esté en la nota. Marcá con [ilegible] lo que no se entienda.", why: "Respeta el hábito de tomar apuntes y lo transforma en material reutilizable." },
  { id: "p3", level: "inicio", domain: "Privacidad", title: "Revisión previa de datos", objective: "Preparar un texto antes de usarlo en un asistente público.", prompt: "Actuá como asistente de protección de datos. Te voy a pegar un texto de práctica. Listá qué elementos deberían anonimizarse antes de usarlo en una IA pública, agrupados por categoría: personas, documentos de identidad, domicilios, contactos, expedientes, fechas identificatorias y datos de salud. Proponé una versión con etiquetas genéricas y consistentes.", why: "Instala la rutina prudente sin frenar el aprendizaje." },
  { id: "p4", level: "inicio", domain: "Borradores", title: "Esquema antes de redactar", objective: "Ordenar ideas sin producir texto todavía.", prompt: "A partir de estas notas armá solo un esquema de trabajo. No redactes. Separá: hechos, documentación disponible, puntos dudosos, líneas de análisis posibles y datos faltantes. Marcá con [verificar] todo lo que no esté respaldado por el material que te di.", why: "Fuerza la etapa donde la corrección rinde más." },
  { id: "p5", level: "inicio", domain: "Lectura", title: "Resumen con límites declarados", objective: "Comprimir un documento largo sin perder advertencias.", prompt: "Resumí el documento adjunto en no más de 300 palabras. Estructura: partes, objeto, hechos relevantes en orden cronológico, pretensiones y estado procesal. Si algún dato no surge del texto, escribí «no consta» en lugar de inferirlo. Al final agregá una lista de lo que quedó fuera del resumen por falta de información.", why: "Un resumen que declara sus huecos es verificable; uno que los tapa, no." },
  { id: "p6", level: "inicio", domain: "Búsqueda", title: "Diseñar la consulta, no pedir la respuesta", objective: "Usar la IA como planificadora de búsqueda.", prompt: "Necesito encontrar [tipo de documento] sobre [tema] en [portal oficial]. No me des el resultado ni cites fuentes: dame cinco consultas de búsqueda con operadores, con sinónimos del vocabulario técnico y variantes de redacción. Explicá en una línea qué busca cada una y cuál conviene probar primero.", why: "Separa lo que la IA hace bien de lo que hace mal." },
  { id: "p7", level: "inicio", domain: "Escritura", title: "Correo institucional breve", objective: "Redactar una comunicación interna clara.", prompt: "Actuá como redactor institucional. Escribí un correo interno de no más de 120 palabras para comunicar [asunto]. Tono formal pero directo, sin fórmulas de cortesía extensas. Que la primera oración diga qué se necesita y para cuándo. Cerrá con una sola acción concreta esperada del destinatario.", why: "La brevedad con acción explícita reduce el ida y vuelta." },
  { id: "p8", level: "inicio", domain: "Lenguaje claro", title: "Traducir sin cambiar el sentido", objective: "Hacer comprensible un párrafo técnico.", prompt: "Reescribí el siguiente párrafo en lenguaje claro para una persona sin formación jurídica, sin alterar el sentido ni omitir condiciones. Conservá los términos técnicos que no tengan equivalente y explicalos entre paréntesis la primera vez. Después indicá qué información del original quedó necesariamente simplificada.", why: "El control está en la última pregunta: obliga a declarar qué se perdió." },
  { id: "p9", level: "inicio", domain: "Verificación", title: "Lista de control propia", objective: "Revisar el trabajo propio antes de elevarlo.", prompt: "Actuá como revisor técnico. A partir de este tipo de documento, armá una lista de verificación de diez puntos que yo debería controlar antes de elevarlo. Cada punto tiene que poder responderse con sí o no, sin zonas grises. Ordenalos de mayor a menor consecuencia si el punto falla.", why: "Convierte la revisión en un procedimiento y no en una impresión." },
  { id: "p10", level: "trabajo", domain: "Análisis documental", title: "Separar hechos de inferencias", objective: "Distinguir qué está afirmado de qué está probado.", prompt: "Analizá el texto adjunto y devolvé una tabla de cuatro columnas: afirmación, tipo (hecho afirmado / hecho acreditado / inferencia / valoración), elemento de respaldo citado en el texto, y observación. Si una afirmación no tiene respaldo en el propio texto, escribilo explícitamente. No completes con conocimiento general.", why: "Es la operación que más errores previene en la lectura de un escrito." },
  { id: "p11", level: "trabajo", domain: "Análisis documental", title: "Línea de tiempo con respaldo", objective: "Reconstruir la secuencia de hechos y actuaciones.", prompt: "Construí una línea de tiempo a partir del documento adjunto. Formato: fecha, hecho o actuación, foja o referencia del texto donde consta. Ordená cronológicamente. Cuando una fecha sea aproximada o esté inferida, marcala con [aprox]. Al final listá los períodos sobre los que el documento no dice nada.", why: "El listado final de vacíos suele ser más útil que la línea misma." },
  { id: "p12", level: "trabajo", domain: "Análisis documental", title: "Comparar dos versiones", objective: "Detectar diferencias entre documentos relacionados.", prompt: "Compará los dos textos adjuntos. Devolvé tres bloques: coincidencias sustanciales, diferencias de contenido con la cita textual de cada versión, y elementos presentes en uno y ausentes en el otro. No opines sobre cuál es mejor. Si una diferencia es solo de redacción sin cambio de sentido, clasificala aparte.", why: "La instrucción de no opinar evita que la comparación se convierta en recomendación." },
  { id: "p13", level: "trabajo", domain: "Proyectos de resolución", title: "Control de estructura normativa", objective: "Verificar requisitos formales de una resolución.", prompt: "Actuá como auditor de estructura. Verificá si el proyecto adjunto cumple uno por uno los requisitos de [artículo aplicable]. Devolvé una tabla: inciso, requisito, cumple sí/no, fragmento del texto donde consta o «no consta». No evalúes el criterio jurídico de fondo, solo la presencia de cada elemento exigido.", why: "Los incisos del artículo son una rúbrica binaria de origen normativo." },
  { id: "p14", level: "trabajo", domain: "Proyectos de resolución", title: "Coherencia entre hechos y decisión", objective: "Detectar saltos lógicos en la fundamentación.", prompt: "Analizá la cadena lógica del texto adjunto: hechos acreditados, prueba invocada, norma aplicada y decisión. Señalá cada punto donde la conclusión no se sigue de lo anterior o donde falta un eslabón. Citá textualmente el fragmento en cada caso. No propongas redacción alternativa todavía.", why: "El salto lógico es el defecto que más cuesta ver en el propio texto." },
  { id: "p15", level: "trabajo", domain: "Sesgo", title: "Análisis sin pista de respuesta", objective: "Obtener un contraste honesto sobre una cuestión.", prompt: "Sobre la cuestión planteada en el material adjunto, presentá los argumentos a favor y en contra de cada una de las posiciones posibles, con igual extensión y sin indicar cuál considerás más sólida. Al final listá qué información adicional inclinaría la balanza en cada sentido.", why: "La simetría forzada es la mejor defensa contra la complacencia." },
  { id: "p16", level: "trabajo", domain: "Sesgo", title: "Rúbrica antes de la crítica", objective: "Pedir evaluación objetiva de un texto propio.", prompt: "Vas a evaluar el texto adjunto con esta rúbrica: [criterio 1, 25 puntos], [criterio 2, 25], [criterio 3, 25], [criterio 4, 25]. Cada criterio se cumple o no se cumple, sin puntajes intermedios dentro de sus sub-ítems. Evaluá categoría por categoría, justificá con cita textual, y sumá el total recién al final. Después listá tres cambios concretos que más subirían el puntaje.", why: "Evaluar primero y sumar después evita que justifique una conclusión previa." },
  { id: "p17", level: "trabajo", domain: "Escritura", title: "Tres esquemas, no un texto", objective: "Iniciar la redacción por donde rinde.", prompt: "Necesito redactar [tipo de documento] sobre [tema], con este material de base. No redactes todavía. Dame tres opciones de esquema con enfoques distintos, cada una con sus títulos de sección y una línea explicando qué prioriza. Después de que elija, expandimos a viñetas.", why: "Corregir un esquema reescribe secciones enteras; corregir el texto, palabras." },
  { id: "p18", level: "trabajo", domain: "Escritura", title: "Detección de relleno", objective: "Depurar un borrador de frases vacías.", prompt: "Revisá el borrador adjunto y señalá cada oración que no aporte información verificable: fórmulas tautológicas, principios generales enunciados sin aplicarse al caso, adjetivación sin respaldo y construcciones del tipo «no se trata de X sino de Y» con términos vagos. Citá cada una y proponé si se elimina o se reemplaza por contenido concreto.", why: "El relleno se detecta mejor por patrones que por lectura general." },
  { id: "p19", level: "trabajo", domain: "Lenguaje claro", title: "Revisión con reglas explícitas", objective: "Aplicar criterios institucionales de redacción.", prompt: "Actuá como corrector de estilo institucional. Revisá el texto adjunto según estos criterios: oraciones de menos de 30 palabras, voz activa, un concepto por párrafo, sin gerundios de posterioridad, sin latinismos innecesarios, con desarrollo de siglas en su primera aparición. Devolvé una tabla: fragmento original, criterio incumplido, propuesta de reemplazo. No cambies el sentido.", why: "El formato de tabla permite aceptar o rechazar cada cambio por separado." },
  { id: "p20", level: "trabajo", domain: "Perspectiva de género", title: "Revisión con enfoque diferencial", objective: "Detectar sesgos y estereotipos en un texto.", prompt: "Revisá el texto adjunto e identificá: uso de estereotipos de género, lenguaje que invisibiliza, valoración diferencial de conductas según el género de quien las realiza, y omisión de circunstancias de vulnerabilidad relevantes para el caso. Citá cada hallazgo y proponé una redacción alternativa que conserve el contenido jurídico.", why: "Pedir la cita textual evita observaciones genéricas no accionables." },
  { id: "p21", level: "trabajo", domain: "Audiencias", title: "Preguntas desde el material", objective: "Preparar una intervención a partir de fuentes.", prompt: "A partir de los documentos adjuntos, elaborá un listado de preguntas para [tipo de audiencia o entrevista]. Agrupalas por tema. Para cada pregunta indicá qué fragmento del material la origina y qué información busca obtener. Marcá aparte las preguntas cuya respuesta ya consta en el material.", why: "El último grupo evita preguntar lo que ya está contestado." },
  { id: "p22", level: "trabajo", domain: "Gestión", title: "Del audio a la lista de temas", objective: "Convertir una reunión grabada en material accionable.", prompt: "A partir de la transcripción adjunta, devolvé: temas tratados en orden de aparición, decisiones tomadas con su responsable si se mencionó, tareas pendientes con plazo si se indicó, y cuestiones que quedaron abiertas sin resolución. No infieras responsables ni plazos que no se hayan dicho explícitamente.", why: "La prohibición de inferir es lo que hace confiable la minuta." },
  { id: "p23", level: "trabajo", domain: "Verificación", title: "Auditar una respuesta de IA", objective: "Revisar críticamente un texto generado.", prompt: "Te voy a pegar una respuesta producida por otro asistente. Identificá: afirmaciones verificables, afirmaciones que suenan verificables pero no lo son, datos concretos que requieren comprobación en fuente oficial, y afirmaciones sin respaldo posible. No corrijas el texto: solo clasificá y listá qué habría que comprobar y dónde.", why: "Entrena la lectura crítica que el circuito de verificación necesita." },
  { id: "p24", level: "circuito", domain: "Circuito completo", title: "Búsqueda oficial y análisis", objective: "Encadenar diseño de búsqueda, descarga y trabajo sobre fuente.", prompt: "Vamos a trabajar en tres etapas y quiero que respetes el orden. Etapa 1: dame consultas con operadores para buscar [tema] en [portales oficiales], sin darme resultados ni citas. Etapa 2: te voy a cargar los documentos que descargue y vas a esperar sin analizar nada hasta que estén todos. Etapa 3: recién ahí analizás, con cita textual obligatoria de cada afirmación y marcando lo que no surja de las fuentes.", why: "Explicitar las etapas evita que el modelo se adelante e invente." },
  { id: "p25", level: "circuito", domain: "Circuito completo", title: "Borrador con campos de control", objective: "Producir un borrador que exija verificación antes de usarse.", prompt: "Redactá un borrador de [tipo de documento] con el material adjunto. Toda mención a norma, fecha, monto, plazo o cita debe quedar entre [[dobles corchetes]] para que yo la verifique. Al final del documento incluí una tabla con cada elemento marcado, dónde debería verificarse y qué pasa si es incorrecto. No entregues el borrador sin esa tabla.", why: "El borrador llega con su propio plan de verificación incorporado." },

const shuffle = (arr, seed = 7) => {
  const a = [...arr];
  let s = seed;
  const rnd = () => { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; };
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

function detectPII(text) {
  const hits = [];
  anonDetectors.forEach(d => {
    const re = new RegExp(d.re.source, d.re.flags.includes('g') ? d.re.flags : d.re.flags + 'g');
    let m;
    while ((m = re.exec(text)) !== null) {
      const t = m[0];
      if (m.index === re.lastIndex) re.lastIndex++;
      if (t.trim().length < 3) continue;
      if (d.id === 'persona') {
        if (anonStopwords.has(t.trim())) continue;
        if (anonPrefijosProcesales.includes(t.trim().split(/\s+/)[0])) continue;
      }
      if (d.id === 'dni') {
        // Un monto en pesos tiene la misma forma que un documento.
        const antes = text.slice(Math.max(0, m.index - 14), m.index);
        if (/[$]\s*$/.test(antes) || /PESOS\s*\(?\s*$/i.test(antes)) continue;
      }
      hits.push({ start: m.index, end: m.index + t.length, text: t, det: d });
    }
  });
  hits.sort((a, b) => (a.start - b.start) || ((b.end - b.start) - (a.end - a.start)));
  const clean = [];
  let last = -1;
  hits.forEach(h => { if (h.start >= last) { clean.push(h); last = h.end; } });
  return clean;
}

function assignTags(hits) {
  const people = new Map();
  let i = 0;
  hits.forEach(h => {
    if (h.det.id === 'persona' || h.det.id === 'propio') {
      const key = h.text.trim().toUpperCase().replace(/^(DR|DRA|SR|SRA|SRTA)\.?\s+/, '');
      if (!people.has(key)) {
        people.set(key, '[PERSONA_' + String.fromCharCode(65 + (i++ % 26)) + ']');
      }
      h.tag = people.get(key);
    } else {
      h.tag = h.det.tag;
    }
  });
  return people;
}

const AnonDetector = () => {
  const [text, setText] = useState('');
  const [ran, setRan] = useState(false);

  const analysis = useMemo(() => {
    if (!ran || !text.trim()) return null;
    const hits = detectPII(text);
    const people = assignTags(hits);
    let anon = text;
    [...hits].reverse().forEach(h => {
      anon = anon.slice(0, h.start) + h.tag + anon.slice(h.end);
    });
    const counts = {};
    hits.forEach(h => { counts[h.det.label] = (counts[h.det.label] || 0) + 1; });
    const glosario = [];
    const seen = new Set();
    hits.forEach(h => {
      const k = h.tag + '||' + h.text.trim();
      if (!seen.has(k)) { seen.add(k); glosario.push({ tag: h.tag, orig: h.text.trim(), cat: h.det.label }); }
    });
    return { hits, people, anon, counts, glosario };
  }, [text, ran]);

  const segments = useMemo(() => {
    if (!analysis) return null;
    const out = [];
    let pos = 0;
    analysis.hits.forEach((h, i) => {
      if (h.start > pos) out.push({ plain: text.slice(pos, h.start), key: 'p' + i });
      out.push({ hit: h, key: 'h' + i });
      pos = h.end;
    });
    if (pos < text.length) out.push({ plain: text.slice(pos), key: 'pz' });
    return out;
  }, [analysis, text]);

  return (
    <div className="space-y-6">

const MemoryPairs = ({ data }) => {
  const cards = useMemo(() => shuffle(data.pairs.flatMap(p => [
    { id: p.id, side: 'a', text: p.a }, { id: p.id, side: 'b', text: p.b }
  ]), 13), [data]);
  const [sel, setSel] = useState([]);
  const [done, setDone] = useState([]);
  const [tries, setTries] = useState(0);

  const click = (i) => {
    if (sel.includes(i) || done.includes(cards[i].id) || sel.length === 2) return;
    const next = [...sel, i];
    setSel(next);
    if (next.length === 2) {
      setTries(t => t + 1);
      const [x, y] = next;
      if (cards[x].id === cards[y].id && cards[x].side !== cards[y].side) {
        setTimeout(() => { setDone(d => [...d, cards[x].id]); setSel([]); }, 500);
      } else {
        setTimeout(() => setSel([]), 900);
      }
    }
  };
  const complete = done.length === data.pairs.length;

  return (
    <div>
      <div className="grid grid-cols-2 md:grid-cols-3 gap-2 mb-4">
        {cards.map((c, i) => {
          const matched = done.includes(c.id);
          const active = sel.includes(i);
          return (
            <button key={i} onClick={() => click(i)} disabled={matched}
              className={`p-3 rounded-xl text-sm text-left min-h-[5rem] transition-all border-2 ${matched ? 'bg-emerald-50 border-emerald-300 text-emerald-900' :
                active ? 'bg-indigo-100 border-indigo-400 text-indigo-900' : 'bg-white border-slate-200 text-slate-700 hover:border-slate-400'}`}>
              {c.text}
            </button>
          );
        })}
      </div>
      <div className="flex items-center justify-between text-sm">
        <span className="text-slate-500">{done.length} de {data.pairs.length} · {tries} intentos</span>
        {complete && <span className="font-bold text-emerald-700 flex items-center gap-2"><CheckCircle2 className="w-4 h-4" /> Completo</span>}
      </div>
    </div>
  );
};

const OrderSteps = ({ data }) => {
  const pool = useMemo(() => shuffle(data.steps, 29), [data]);
  const [picked, setPicked] = useState([]);
  const [error, setError] = useState(null);
  const next = data.steps[picked.length];

  const click = (s) => {
    if (picked.includes(s)) return;
    if (s === next) { setPicked(p => [...p, s]); setError(null); }
    else { setError(s); setTimeout(() => setError(null), 1200); }
  };

  return (
    <div>
      <div className="space-y-2 mb-4">
        {pool.map((s, i) => {
          const idx = picked.indexOf(s);
          const ok = idx >= 0;
          return (
            <button key={i} onClick={() => click(s)} disabled={ok}
              className={`w-full text-left p-3 rounded-xl text-sm border-2 transition-all flex items-start gap-3 ${ok ? 'bg-emerald-50 border-emerald-300 text-emerald-900' :
                error === s ? 'bg-rose-100 border-rose-400 text-rose-900' : 'bg-white border-slate-200 text-slate-700 hover:border-slate-400'}`}>
              <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 ${ok ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-500'}`}>{ok ? idx + 1 : '·'}</span>
              <span>{s}</span>
            </button>
          );
        })}
      </div>
      {picked.length === data.steps.length && (
        <p className="font-bold text-emerald-700 flex items-center gap-2 text-sm"><CheckCircle2 className="w-4 h-4" /> Circuito completo y en orden.</p>
      )}
    </div>
  );
};

const SpotDifference = ({ data }) => {
  const [i, setI] = useState(0);
  const [chosen, setChosen] = useState(null);
  const r = data.rounds[i];
  const pick = (k) => { if (!chosen) setChosen(k); };
  const advance = () => { setChosen(null); setI(x => Math.min(x + 1, data.rounds.length - 1)); };

  return (
    <div>
      <p className="text-xs font-bold text-slate-400 uppercase mb-3">Ronda {i + 1} de {data.rounds.length}</p>
      <div className="grid md:grid-cols-2 gap-3 mb-4">
        {['a', 'b'].map(k => {
          const isRight = r.correct === k;
          const show = chosen !== null;
          return (
            <button key={k} onClick={() => pick(k)} disabled={show}
              className={`p-4 rounded-xl text-sm text-left border-2 transition-all ${!show ? 'bg-white border-slate-200 hover:border-slate-400 text-slate-700' :
                isRight ? 'bg-emerald-50 border-emerald-400 text-emerald-900' : 'bg-rose-50 border-rose-300 text-rose-900 opacity-70'}`}>
              <span className="block text-xs font-bold uppercase mb-1 opacity-60">Opción {k.toUpperCase()}</span>
              {r[k]}
            </button>
          );
        })}
      </div>
      {chosen && (
        <div className="space-y-3">
          <Callout tone={chosen === r.correct ? 'emerald' : 'amber'} icon={chosen === r.correct ? CheckCircle2 : Lightbulb}
            title={chosen === r.correct ? 'Correcto' : 'La mejor era la otra'}>
            {r.why}
          </Callout>
          {i < data.rounds.length - 1 && (
            <button onClick={advance} className="px-4 py-2 rounded-lg text-sm font-bold bg-slate-800 text-white hover:bg-slate-700 inline-flex items-center gap-2">
              Siguiente <ArrowRight className="w-4 h-4" />
            </button>
          )}
        </div>
      )}
    </div>
  );
};

const AssociationGame = ({ data }) => {
  const rights = useMemo(() => shuffle(data.pairs.map(p => p.right), 41), [data]);
  const [sel, setSel] = useState(null);
  const [done, setDone] = useState([]);
  const [wrong, setWrong] = useState(null);

  const clickRight = (r) => {
    if (sel === null) return;
    const pair = data.pairs[sel];
    if (pair.right === r) { setDone(d => [...d, sel]); setSel(null); }
    else { setWrong(r); setTimeout(() => setWrong(null), 900); }
  };

  return (
    <div className="grid md:grid-cols-2 gap-4">
      <div className="space-y-2">
        <p className="text-xs font-bold text-slate-400 uppercase">Necesidad</p>
        {data.pairs.map((p, i) => (
          <button key={i} onClick={() => { if (!done.includes(i)) setSel(i); }} disabled={done.includes(i)}
            className={`w-full text-left p-3 rounded-xl text-sm border-2 transition-all ${done.includes(i) ? 'bg-emerald-50 border-emerald-300 text-emerald-900' :
              sel === i ? 'bg-indigo-100 border-indigo-400 text-indigo-900' : 'bg-white border-slate-200 text-slate-700 hover:border-slate-400'}`}>
            {p.left}
          </button>
        ))}
      </div>
      <div className="space-y-2">
        <p className="text-xs font-bold text-slate-400 uppercase">Vía de trabajo</p>
        {rights.map((r, i) => {
          const matched = data.pairs.some((p, k) => done.includes(k) && p.right === r);
          return (
            <button key={i} onClick={() => clickRight(r)} disabled={matched}
              className={`w-full text-left p-3 rounded-xl text-sm border-2 transition-all ${matched ? 'bg-emerald-50 border-emerald-300 text-emerald-900' :
                wrong === r ? 'bg-rose-100 border-rose-400 text-rose-900' : 'bg-white border-slate-200 text-slate-700 hover:border-slate-400'}`}>
              {r}
            </button>
          );
        })}
      </div>
      {done.length === data.pairs.length && (
        <p className="md:col-span-2 font-bold text-emerald-700 flex items-center gap-2 text-sm"><CheckCircle2 className="w-4 h-4" /> Todas asociadas.</p>
      )}
    </div>
  );
};

const SearchSection = () => {
  const [frase, setFrase] = useState('');

    const p = [];
    if (frase.trim()) p.push('"' + frase.trim() + '"');
    if (titulo.trim()) p.push('intitle:' + titulo.trim());
    if (sitio.trim()) p.push('site:' + sitio.trim());

    if (excluir.trim()) p.push(...excluir.trim().split(/\s+/).map(w => '-' + w));
    if (desde.trim()) p.push('after:' + desde.trim());
    return p.join(' ');

            <input className={field} value={titulo} onChange={e => setTitulo(e.target.value)} placeholder="acordada" /></label>
          <label className="block"><span className="text-xs font-bold text-slate-500 uppercase">Dominio</span>
            <input className={field} value={sitio} onChange={e => setSitio(e.target.value)} placeholder="jusrionegro.gov.ar" /></label>

        <div className="rounded-xl bg-slate-900 p-4 flex flex-wrap items-center justify-between gap-3">
